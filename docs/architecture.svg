<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <title>Lattice 主窗口、组件运行时与 Rust 后端架构</title>
  <desc>主窗口 React AppShell 包含 Sidebar、Topbar、Dashboard 与 Workspace。Dashboard 和 Workspace 页面层同时挂载，Zustand 选择可见页；Canvas、WidgetFrame 和组件 iframe 在 Dashboard 隐藏时保持挂载。组件运行时和宿主通过桥连接沙箱组件，平台通过 Tauri 命令连接 Rust 后端。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="820" height="520" fill="#FFFFFF"/>

  <rect x="30" y="28" width="500" height="286" rx="14" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="50" y="54" font-size="14" font-weight="600" fill="#26215C" dominant-baseline="central">主窗口 · React AppShell</text>
  <rect x="50" y="72" width="110" height="42" rx="8" fill="#FFFFFF" stroke="#AFA9EC"/>
  <text x="105" y="93" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Sidebar</text>
  <rect x="174" y="72" width="336" height="42" rx="8" fill="#FFFFFF" stroke="#AFA9EC"/>
  <text x="342" y="93" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Topbar · 全局搜索 / 主题 / Assistant</text>

  <rect x="50" y="130" width="460" height="160" rx="10" fill="#FFFFFF" stroke="#AFA9EC"/>
  <text x="68" y="152" font-size="12" font-weight="600" fill="#3C3489" dominant-baseline="central">页面层由 Zustand activeView 切换；两层始终挂载</text>
  <rect x="68" y="168" width="190" height="102" rx="8" fill="#F8F7FF" stroke="#AFA9EC"/>
  <text x="163" y="190" font-size="12" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Dashboard</text>
  <text x="163" y="214" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">默认可见</text>
  <text x="163" y="238" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Workspace 仍保留</text>
  <rect x="278" y="168" width="214" height="102" rx="8" fill="#F8F7FF" stroke="#AFA9EC"/>
  <text x="385" y="190" font-size="12" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Workspace</text>
  <text x="385" y="214" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Library · Canvas · Inspector</text>
  <text x="385" y="238" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Canvas / WidgetFrame 常驻挂载</text>
  <line x1="258" y1="218" x2="278" y2="218" stroke="#7F77DD" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="268" y="282" font-size="9" fill="#534AB7" text-anchor="middle" dominant-baseline="central">可见切换</text>

  <rect x="30" y="338" width="500" height="72" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.7"/>
  <text x="50" y="362" font-size="13" font-weight="600" fill="#26215C" dominant-baseline="central">组件运行时与宿主</text>
  <text x="50" y="388" font-size="11" fill="#534AB7" dominant-baseline="central">WidgetFrame（画布） / widgetHost（桌面） → 同一桥契约 → 沙箱 iframe</text>

  <rect x="30" y="434" width="500" height="58" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.7" stroke-dasharray="5 4"/>
  <text x="50" y="458" font-size="13" font-weight="600" fill="#26215C" dominant-baseline="central">第三方组件</text>
  <text x="180" y="458" font-size="11" fill="#534AB7" dominant-baseline="central">源不透明 iframe；只能经权限桥调用平台能力</text>

  <rect x="580" y="28" width="210" height="464" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.7"/>
  <text x="602" y="56" font-size="14" font-weight="600" fill="#042C53" dominant-baseline="central">Rust / Tauri</text>
  <text x="602" y="78" font-size="11" fill="#185FA5" dominant-baseline="central">只有后端碰系统与磁盘</text>
  <rect x="602" y="104" width="166" height="64" rx="8" fill="#FFFFFF" stroke="#85B7EB"/>
  <text x="685" y="128" font-size="12" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">窗口与事件</text>
  <text x="685" y="148" font-size="10.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Win32 · Tauri events</text>
  <rect x="602" y="188" width="166" height="64" rx="8" fill="#FFFFFF" stroke="#85B7EB"/>
  <text x="685" y="212" font-size="12" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">文件与状态</text>
  <text x="685" y="232" font-size="10.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">原子替换 · 用户数据</text>
  <rect x="602" y="272" width="166" height="64" rx="8" fill="#FFFFFF" stroke="#85B7EB"/>
  <text x="685" y="296" font-size="12" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">受控能力</text>
  <text x="685" y="316" font-size="10.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">网络 · 音频 · Agent</text>
  <text x="602" y="382" font-size="10.5" fill="#185FA5" dominant-baseline="central">主窗口导航与组件</text>
  <text x="602" y="400" font-size="10.5" fill="#185FA5" dominant-baseline="central">页面活跃由前端状态管理；</text>
  <text x="602" y="418" font-size="10.5" fill="#185FA5" dominant-baseline="central">窗口可见性由 Rust 通知，</text>
  <text x="602" y="436" font-size="10.5" fill="#185FA5" dominant-baseline="central">两个生命周期信号各自独立。</text>

  <line x1="530" y1="218" x2="580" y2="218" stroke="#378ADD" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="555" y="202" font-size="10" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Tauri 命令</text>
  <line x1="280" y1="314" x2="280" y2="338" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="295" y="326" font-size="10" fill="#534AB7" dominant-baseline="central">页面层</text>
  <line x1="280" y1="410" x2="280" y2="434" stroke="#7F77DD" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="295" y="422" font-size="10" fill="#534AB7" dominant-baseline="central">权限桥</text>
</svg>
