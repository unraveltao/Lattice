<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <title>渲染链路的五跳</title>
  <desc>从布局数据开始，依次经过建窗口、宿主页、沙箱组件，最后由桥查权限并执行。第三跳分叉为设计态与运行态两个宿主。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="444" fill="#FFFFFF"/>

  <line x1="56" y1="72" x2="56" y2="392" stroke="#7F77DD" stroke-width="1.5"/>
  <line x1="56" y1="72" x2="76" y2="72" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="56" y1="152" x2="76" y2="152" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="56" y1="232" x2="76" y2="232" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="56" y1="312" x2="76" y2="312" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="56" y1="392" x2="76" y2="392" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="76" y="40" width="564" height="64" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="96" y="64" font-size="12" font-weight="500" fill="#26215C" dominant-baseline="central">布局数据</text>
  <text x="96" y="85" font-size="11" fill="#534AB7" dominant-baseline="central">画布上每个实例摆在哪、哪一层、置不置顶 —— 一条 placement 一条记录</text>

  <rect x="76" y="120" width="564" height="64" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="96" y="144" font-size="12" font-weight="500" fill="#26215C" dominant-baseline="central">建窗口</text>
  <text x="96" y="165" font-size="11" fill="#534AB7" dominant-baseline="central">先登记宿主配置，再 build，最后 show —— 顺序反了层级就白设</text>

  <rect x="76" y="200" width="564" height="64" rx="10" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="96" y="224" font-size="12" font-weight="500" fill="#26215C" dominant-baseline="central">宿主页</text>
  <text x="96" y="245" font-size="11" fill="#3C3489" dominant-baseline="central">设计态进 WidgetFrame，运行态进 widget-host；两者走同一张桥方法表</text>

  <rect x="76" y="280" width="564" height="64" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="96" y="304" font-size="12" font-weight="500" fill="#26215C" dominant-baseline="central">沙箱组件</text>
  <text x="96" y="325" font-size="11" fill="#534AB7" dominant-baseline="central">组件在 iframe 里跑，源不透明 —— 它想做事，只能发一条 postMessage</text>

  <rect x="76" y="360" width="564" height="64" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="96" y="384" font-size="12" font-weight="500" fill="#042C53" dominant-baseline="central">桥</text>
  <text x="96" y="405" font-size="11" fill="#185FA5" dominant-baseline="central">先查这个组件的权限，再执行；未授权回结构化错误，不抛裸异常</text>
</svg>
