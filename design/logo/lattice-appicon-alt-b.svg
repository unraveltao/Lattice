  <g fill="#0F6E56">
    <rect x="88"  y="88" width="40" height="336"/>
    <rect x="196" y="88" width="26" height="336"/>
    <rect x="290" y="88" width="26" height="336"/>
    <rect x="384" y="88" width="40" height="336"/>
    <rect x="88"  y="88"  width="336" height="40"/>
    <rect x="88"  y="196" width="336" height="26"/>
    <rect x="88"  y="290" width="336" height="26"/>
    <rect x="88"  y="384" width="336" height="40"/>
  </g>
  <g fill="#5DCAA5">
    <rect x="128" y="128" width="68" height="68"/>
    <rect x="222" y="222" width="68" height="68"/>
    <rect x="316" y="316" width="68" height="68"/>
  </g>
