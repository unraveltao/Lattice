<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>secret bridge test</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font: 12px/1.6 ui-monospace, monospace;
        padding: 16px;
      }
      .ok {
        color: #5dcaa5;
      }
      .bad {
        color: #f09595;
      }
    </style>
  </head>
  <body>
    <!--
      密封密钥的桥这一侧（`secret.*`）。

      这里钉的是**桥**，不是 DPAPI —— 真正的加解密只有真机能验（`secrets.rs`，
      review + 手工按设计 0026 §6 走一遍）。这一页能钉住的是四件事：

        1. `name` 的形状（组件想自己拼前缀就在这儿被拒）
        2. **`widgetId` 来自宿主，不是组件递上来的那个** —— 命名空间隔离
        3. `null` 与"读不出来"是两种结果，不能合并
        4. 浏览器预览里直接报错，**不退回 localStorage**

      `__TAURI_INTERNALS__` 是 `@tauri-apps/api` 唯一的入口（`invoke` 就是
      `window.__TAURI_INTERNALS__.invoke(...)`），所以桩它一个就够。
    -->
    <pre id="out">running…</pre>
    <script type="module">
      import { handleBridgeRequest } from "/src/runtime/bridge.ts";

      const HOST_WIDGET = "lattice.__test";
      const lines = [];
      const log = (pass, text) => lines.push((pass ? "PASS " : "FAIL ") + text);

      /** 假的 Tauri 后端：记下每一次调用，按 `plan` 决定回什么 */
      let calls = [];
      let plan = () => null;
      window.__TAURI_INTERNALS__ = {
        invoke: async (command, args) => {
          calls.push({ command, args });
          return plan(command, args);
        },
      };

      function call(method, params, granted = ["secret"]) {
        return new Promise((resolve) => {
          handleBridgeRequest(
            { __lattice: 1, type: "request", id: 1, method, params },
            {
              instanceId: "test-instance",
              widgetId: HOST_WIDGET,
              granted: new Set(granted),
              config: {},
              reply: (payload) => resolve(payload),
              close: () => {},
            },
          );
        });
      }

      const reset = (next) => {
        calls = [];
        plan = next;
      };

      // 1. 没授权就是 permission_denied，而且说清楚缺哪一项
      const denied = await call("secret.get", { name: "github" }, []);
      log(
        denied.code === "permission_denied" && denied.permission === "secret",
        `未授权时回 ${denied.code} / ${denied.permission}`,
      );

      // 2–7. name 的形状。每一条都是"组件想越界"的一种写法
      const badNames = [
        ["", "空串"],
        ["GitHub", "大写"],
        ["llm.chat", "带点（想自己拼前缀）"],
        ["9lives", "数字开头"],
        ["_x", "下划线开头"],
        ["a".repeat(33), "超过 32 个字符"],
      ];
      for (const [name, why] of badNames) {
        const result = await call("secret.get", { name });
        log(result.code === "bad_params", `${why} 的 name 被拒（${result.code}）`);
      }

      // 8. 存空值没有意义，也不该悄悄存进去
      const empty = await call("secret.set", { name: "github", value: "  " });
      log(empty.code === "bad_params", `空 value 被拒（${empty.code}）`);

      // 9. 存一条：命令名与三个参数都对得上
      reset(() => null);
      const saved = await call("secret.set", { name: "github", value: "ghp_fake" });
      const setCall = calls[0] ?? {};
      log(saved.ok === true && saved.result?.ok === true, "secret.set 回 ok");
      log(
        setCall.command === "secret_set" &&
          setCall.args?.name === "github" &&
          setCall.args?.value === "ghp_fake",
        `存的时候调 ${setCall.command}(${setCall.args?.name}=${setCall.args?.value})`,
      );

      // 10. **组件在 params 里塞 widgetId 也没用**：键名只按宿主的那一份拼
      reset(() => null);
      await call("secret.set", {
        widgetId: "lattice.someone.else",
        name: "github",
        value: "ghp_fake",
      });
      log(
        calls[0]?.args?.widgetId === HOST_WIDGET,
        `组件递上来的 widgetId 被忽略（Rust 收到 ${calls[0]?.args?.widgetId}）`,
      );

      // 11. 没填过 → `{ value: null }`，不是错误
      reset(() => null);
      const missing = await call("secret.get", { name: "github" });
      log(
        missing.ok === true && missing.result?.value === null,
        `没填过时回 ${JSON.stringify(missing.result)}`,
      );

      // 12. 填过 → 原样交回组件（这条口子是故意开的：组件要拿它发请求）
      reset(() => "ghp_fake");
      const found = await call("secret.get", { name: "github" });
      log(found.result?.value === "ghp_fake", `读回来的是 ${found.result?.value}`);

      // 13. **读不出来 ≠ 没填过**。换成 internal 错误，界面上是另一句话
      reset(() => {
        throw new Error("this Windows account cannot open the secrets file");
      });
      const broken = await call("secret.get", { name: "github" });
      log(
        broken.ok === false && broken.code === "internal" && broken.result === undefined,
        `解不开时回 ${broken.code}（不是 value:null）`,
      );

      // 14. 删
      reset(() => null);
      const dropped = await call("secret.delete", { name: "github" });
      log(
        dropped.result?.ok === true && calls[0]?.command === "secret_delete",
        `删的时候调 ${calls[0]?.command}`,
      );

      // 15. 浏览器预览里报错，**不退回 localStorage**：一个"预览明文、桌面加密"
      //     的落差比"预览里用不了"危险得多
      delete window.__TAURI_INTERNALS__;
      const preview = await call("secret.set", { name: "github", value: "ghp_fake" });
      const leaked = Object.keys(localStorage).filter((key) =>
        (localStorage.getItem(key) ?? "").includes("ghp_fake"),
      );
      log(preview.code === "internal", `预览里存密钥回 ${preview.code}`);
      log(leaked.length === 0, `预览里没有落到 localStorage（命中 ${leaked.length} 个键）`);

      const passed = lines.filter((line) => line.startsWith("PASS")).length;
      document.getElementById("out").innerHTML =
        lines
          .map((line) => `<span class="${line.startsWith("PASS") ? "ok" : "bad"}">${line}</span>`)
          .join("\n") + `\n\n${passed}/${lines.length} passed`;
    </script>
  </body>
</html>
