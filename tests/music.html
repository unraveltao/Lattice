<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>music widget test</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font: 12px/1.6 ui-monospace, monospace;
        padding: 16px;
      }
      .ok {
        color: #5dcaa5;
      }
      .bad {
        color: #f09595;
      }
      iframe {
        position: absolute;
        left: -9999px;
        width: 268px;
        height: 172px;
      }
    </style>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      /*
       * Music 组件的渲染、控制与那条声音折线。
       *
       * 这页钉九件事：
       *   1. 有会话时曲名 / 歌手 / 来源 / 进度各就各位，**来源要翻成人话**
       *      （`Spotify.exe` 显示成 `Spotify`，这是它以前最像"坏了"的地方）
       *   2. 没会话（`media.get` 返回 null）是"没在放"，不是错误
       *   3. 没授权时说人话，并且不留半个旧会话
       *   4. 按下播放键要真的发 `media.control`，而且图标**立刻**翻 ——
       *      等下一次轮询（两秒后）才翻的话，用户会以为点空了再点一次
       *   5. 直播（时长 0）不画进度条：一条永远停在 0 的槽看着像坏了
       *   6. 改"刷新间隔"要重挂时间轴，而不是继续用旧间隔
       *   7. 折线的几何：电平 0..1 → 像素坐标，纯函数直接调（`tracePoints`）
       *   8. 采样真的在跑，而且电平变了线跟着动
       *   9. 没 `audio:level` 权限 / 关掉开关时，一个采样都不发
       *
       * 时间相关的断言都用真实 setTimeout，整页一秒多跑完。
       */
      const lines = [];
      const log = (pass, text) => lines.push((pass ? "PASS " : "FAIL ") + text);
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      /*
       * 抛异常也要留一行红字。
       *
       * 不接这两个事件的话，页面里任何一处 `await` 抛出都表现为"#out 停在
       * running…"，而运行器把它读成"0 条断言"—— 和"这页没写断言"一模一样。
       * 那是这套测试最坏的失败模式（见 AGENTS 里 `rustc --test` 壳子那条）。
       */
      const bail = (reason) => {
        lines.push("FAIL 页面抛异常：" + (reason && reason.stack ? reason.stack : String(reason)));
        document.getElementById("out").innerHTML = lines
          .map((line) => `<span class="${line.startsWith("PASS") ? "ok" : "bad"}">${line}</span>`)
          .join("\n");
        window.__done = true;
      };
      window.addEventListener("error", (event) => bail(event.error ?? event.message));
      window.addEventListener("unhandledrejection", (event) => bail(event.reason));

      const base = {
        title: "Ocean Drive",
        artist: "Ducktail",
        album: "Nightfall",
        // SMTC 给的是 AUMID，不是人看的名字 —— 组件负责翻译
        source: "Spotify.exe",
        canPlayPause: true,
        canNext: true,
        canPrevious: true,
      };

      /** 暂停中的会话：位置不会自己走，进度条宽高可以精确断言 */
      const PAUSED = {
        ...base,
        status: "paused",
        positionMs: 187000,
        durationMs: 400000,
      };
      const PLAYING = { ...PAUSED, status: "playing" };
      const LIVE = { ...base, status: "playing", positionMs: 0, durationMs: 0 };

      /**
       * 装一份组件，返回句柄。
       *
       * `session` 是 `media.get` 的回答：`undefined` 表示"没有会话"（null），
       * `"denied"` 表示权限被拒。
       * `level` 是 `audio.level` 的回答：数字表示响度，`"denied"` 表示权限被拒。
       */
      function mount({
        session,
        level = 0.5,
        config = { pollMs: 2000, showProgress: true, showLevel: true },
      } = {}) {
        const frame = document.createElement("iframe");
        frame.setAttribute("sandbox", "allow-scripts allow-same-origin");
        frame.src = "/widgets/lattice.music/index.html";
        document.body.appendChild(frame);

        const calls = [];
        const controls = [];
        const schedule = [];

        const ready = new Promise((resolve) => {
          window.addEventListener("message", function handler(event) {
            if (event.source !== frame.contentWindow) return;
            const data = event.data;
            if (!data || data.__lattice !== 1) return;

            if (data.type === "ready") {
              resolve();
              return;
            }
            if (data.type !== "request") return;

            calls.push(data.method);
            const reply = (payload) =>
              frame.contentWindow.postMessage(
                Object.assign({ __lattice: 1, type: "response", id: data.id }, payload),
                "*",
              );

            switch (data.method) {
              case "config.get":
                reply({ ok: true, result: config });
                return;
              case "schedule.every":
                schedule.push({ kind: "every", every: data.params.every });
                reply({ ok: true, result: { id: schedule.length, every: data.params.every } });
                return;
              case "schedule.clear":
                schedule.push({ kind: "clear", id: data.params.id });
                reply({ ok: true, result: { ok: true } });
                return;
              case "media.get":
                if (session === "denied") {
                  reply({
                    ok: false,
                    code: "permission_denied",
                    error: "permission not granted: media:control",
                    permission: "media:control",
                  });
                  return;
                }
                reply({ ok: true, result: session ?? null });
                return;
              case "media.control":
                controls.push(data.params.action);
                reply({ ok: true, result: { ok: true } });
                return;
              case "audio.level":
                if (level === "denied") {
                  reply({
                    ok: false,
                    code: "permission_denied",
                    error: "permission not granted: audio:level",
                    permission: "audio:level",
                  });
                  return;
                }
                reply({ ok: true, result: { level, running: true } });
                return;
              default:
                reply({ ok: false, code: "unknown_method", error: "unknown" });
            }
          });
        });

        return {
          frame,
          calls,
          controls,
          schedule,
          ready,
          setConfig(next) {
            // 改的是 handler 里捕获的那个对象：config.get 必须回最新值，
            // 否则"改了间隔"这类用例永远看到启动时那份
            Object.assign(config, next);
            frame.contentWindow.postMessage(
              { __lattice: 1, type: "config-changed", payload: { config: next } },
              "*",
            );
          },
          setLevel(next) {
            level = next;
          },
          doc: () => frame.contentDocument,
          /** 组件里的纯函数（`window.__latticeMusic`）：断言直接调真身，不抄一份 */
          pure: () => frame.contentWindow.__latticeMusic,
        };
      }

      const text = (doc, id) => doc.getElementById(id)?.textContent;
      const points = (doc) => doc.getElementById("wave-line").getAttribute("points") || "";
      /** 折线的最后一段（最新那个点）的 y —— 像素坐标 */
      const newestY = (doc) => {
        const list = points(doc).trim().split(/\s+/).filter(Boolean);
        const last = list[list.length - 1];
        return last ? Number(last.split(",")[1]) : NaN;
      };

      // ---- 1. 正常渲染（暂停态，进度可以精确断言） ----
      {
        const view = mount({ session: PAUSED });
        await view.ready;
        await sleep(120);
        const doc = view.doc();

        log(view.calls.includes("config.get"), `启动先读配置（${view.calls.join(", ")}）`);
        log(view.calls.includes("schedule.every"), "心跳注册走了调度器");
        log(view.schedule[0]?.every === 2000, `用了配置里的间隔（${view.schedule[0]?.every}ms）`);

        log(text(doc, "track") === "Ocean Drive", `曲名「${text(doc, "track")}」`);
        log(text(doc, "artist") === "Ducktail — Nightfall", `歌手 + 专辑「${text(doc, "artist")}」`);
        log(
          text(doc, "source") === "Spotify",
          `来源从 AUMID 翻成人话「${text(doc, "source")}」`,
        );
        log(text(doc, "position") === "3:07", `已播「${text(doc, "position")}」`);
        log(text(doc, "duration") === "6:40", `时长「${text(doc, "duration")}」`);
        log(
          doc.getElementById("bar").style.width === "46.75%",
          `进度条宽 ${doc.getElementById("bar").style.width}`,
        );
        log(!doc.getElementById("progress").hidden, "暂停时进度条还在（只是不走了）");
        // 暂停中，图标该是"播放"，按下去才会播
        log(doc.getElementById("toggle").title === "Play", `主按钮标题「${doc.getElementById("toggle").title}」`);
        log(!doc.getElementById("toggle").disabled, "能暂停 / 继续的会话按钮可用");
        log(
          !doc.getElementById("hint").classList.contains("is-visible"),
          "一切正常时不留提示",
        );
        view.frame.remove();
      }

      // ---- 2. 播放中：进度自己往前走 ----
      {
        const view = mount({ session: PLAYING });
        await view.ready;
        await sleep(120);
        const doc = view.doc();
        log(doc.getElementById("toggle").title === "Pause", "播放中主按钮是暂停");
        const before = doc.getElementById("bar").style.width;
        await sleep(420);
        const after = doc.getElementById("bar").style.width;
        // 秒级的时间文字 400ms 内可能不变，所以看宽度
        log(after !== before, `进度自己在走（${before} → ${after}）`);
        view.frame.remove();
      }

      // ---- 3. 没有会话 ----
      {
        const view = mount({ session: undefined });
        await view.ready;
        await sleep(120);
        const doc = view.doc();

        log(text(doc, "track") === "Nothing playing", `没会话显示「${text(doc, "track")}」`);
        log(text(doc, "artist") === "", "没会话时副标题为空");
        log(doc.getElementById("toggle").disabled, "没会话时主按钮不可用");
        log(doc.getElementById("next").disabled, "没会话时下一首不可用");
        log(doc.getElementById("progress").hidden, "没会话时进度条藏起来");
        log(
          !doc.getElementById("hint").classList.contains("is-visible"),
          "没会话不是错误，不弹提示",
        );
        // 没会话但扬声器在响（游戏、视频）：折线照画，它量的是声音不是歌
        log(!doc.getElementById("wave").hidden, "没会话时折线还在（声音不只有播放器）");

        /*
         * 宿主在 `ready` 之后**一定**补发一次 `config-changed`（`widgetHost.ts`
         * 里 `load` 和 `ready` 各一处）。老版那一行 `progress.hidden = !showProgress`
         * 会把刚藏起来的空进度条又翻出来 —— 卡片上多一条 0:00 / 0:00 的空槽，
         * 而 268×148 的时候它正好把下面那排按钮顶出卡片。这就是"这组件一直有问题"。
         */
        view.setConfig({ pollMs: 2000, showProgress: true, showLevel: true });
        await sleep(150);
        log(
          doc.getElementById("progress").hidden,
          "宿主补发 config-changed 之后，空进度条仍然是藏的",
        );
        view.frame.remove();
      }

      // ---- 4. 权限被拒 ----
      {
        const view = mount({ session: "denied" });
        await view.ready;
        await sleep(120);
        const doc = view.doc();

        log(
          doc.getElementById("hint").classList.contains("is-visible"),
          "没授权时提示条出现",
        );
        log(
          text(doc, "hint") === "Needs the Media control permission",
          `提示文案「${text(doc, "hint")}」`,
        );
        log(text(doc, "track") === "Nothing playing", "没授权时不显示半截旧会话");
        view.frame.remove();
      }

      // ---- 5. 直播：没有时长就不画进度条 ----
      {
        const view = mount({ session: LIVE });
        await view.ready;
        await sleep(120);
        const doc = view.doc();

        log(doc.getElementById("progress").hidden, "时长 0 时进度条藏起来");
        log(text(doc, "duration") === "--:--", `时长显示「${text(doc, "duration")}」`);
        view.frame.remove();
      }

      // ---- 6. 按播放：立刻发控制、图标当场翻 ----
      {
        const view = mount({ session: PAUSED });
        await view.ready;
        await sleep(120);
        const doc = view.doc();

        doc.getElementById("toggle").click();
        // 同步断言：乐观翻转必须在这一帧就生效，不能等轮询
        log(doc.getElementById("toggle").title === "Pause", "点完立刻翻成暂停图标");
        await sleep(80);
        log(view.controls.includes("playPause"), `发出了 ${view.controls.join(", ")}`);
        view.frame.remove();
      }

      // ---- 7. 上一首 / 下一首 ----
      {
        const view = mount({ session: PAUSED });
        await view.ready;
        await sleep(120);
        const doc = view.doc();

        doc.getElementById("prev").click();
        doc.getElementById("next").click();
        await sleep(80);
        log(
          view.controls.join(",") === "previous,next",
          `按钮映射到动作（${view.controls.join(",")}）`,
        );
        view.frame.remove();
      }

      // ---- 8. 改刷新间隔要重挂时间轴 ----
      {
        const view = mount({ session: PAUSED, config: { pollMs: 2000, showProgress: true } });
        await view.ready;
        await sleep(120);

        view.setConfig({ pollMs: 5000, showProgress: true });
        await sleep(200);

        const cleared = view.schedule.some((item) => item.kind === "clear");
        const rearmed = view.schedule.filter((item) => item.kind === "every").pop();
        log(cleared, "间隔变了先退掉旧的心跳");
        log(rearmed?.every === 5000, `按新间隔重挂（${rearmed?.every}ms）`);
        view.frame.remove();
      }

      // ---- 9. 关掉进度条 ----
      {
        const view = mount({ session: PAUSED, config: { pollMs: 2000, showProgress: false } });
        await view.ready;
        await sleep(120);
        const doc = view.doc();

        log(doc.getElementById("progress").hidden, "配置关掉进度条后不显示");
        view.setConfig({ pollMs: 2000, showProgress: true });
        await sleep(200);
        log(!doc.getElementById("progress").hidden, "再打开时立刻回来");
        view.frame.remove();
      }

      // ---- 10. 播放器名：AUMID → 人话 ----
      {
        const view = mount({ session: PAUSED });
        await view.ready;
        const { sourceLabel } = view.pure();

        log(sourceLabel("Spotify.exe") === "Spotify", "Spotify.exe → Spotify");
        log(sourceLabel("SPOTIFY.EXE") === "Spotify", "大小写不影响");
        log(sourceLabel("chrome.exe") === "Chrome", "chrome.exe → Chrome");
        log(sourceLabel("msedge.exe") === "Edge", "msedge.exe → Edge");
        log(
          sourceLabel("Microsoft.ZuneMusic_8wekyb3d8bbwe!Microsoft.ZuneMusic") === "Media Player",
          "包族 AUMID → Media Player",
        );
        log(
          sourceLabel("C:\\Program Files\\Foo\\bar.exe") === "bar",
          "完整路径只留文件名",
        );
        log(sourceLabel("Microsoft.Foo") === "Foo", "厂商前缀被砍掉");
        log(sourceLabel("SomePlayer") === "SomePlayer", "不认识的保持原样");
        log(sourceLabel("") === "" && sourceLabel(null) === "", "空值给空串，不给 undefined");
        view.frame.remove();
      }

      // ---- 11. 折线几何：电平 → 像素 ----
      {
        const view = mount({ session: PAUSED });
        await view.ready;
        const { tracePoints } = view.pure();

        log(tracePoints([], 100, 50, 0) === "", "没有采样就不画点");
        log(tracePoints([0], 0, 50, 0) === "", "尺寸为 0 不画（还没布局完）");
        log(
          tracePoints([0, 0.5, 1], 100, 50, 0) === "0.0,48.0 50.0,25.0 100.0,2.0",
          `三个点铺满宽度：${tracePoints([0, 0.5, 1], 100, 50, 0)}`,
        );
        log(
          tracePoints([0.5], 100, 50, 0) === "0.0,25.0 100.0,25.0",
          "只有一个采样时画一条横线（第一个 80ms 也看得见）",
        );
        // fraction 是"最新那个点已经往左走了多远"
        log(
          tracePoints([0, 0.5, 1], 100, 50, 0.5) === "25.0,25.0 75.0,2.0",
          `插值半格之后：${tracePoints([0, 0.5, 1], 100, 50, 0.5)}`,
        );
        // 越界的电平被夹住，不会画到卡片外面
        log(
          tracePoints([2, -1], 100, 50, 0) === "0.0,2.0 100.0,48.0",
          "电平超过 0..1 会被夹住",
        );
        view.frame.remove();
      }

      // ---- 12. 采样在跑，电平变了线跟着动 ----
      {
        const view = mount({ session: PLAYING, level: 0.5 });
        await view.ready;
        await sleep(400);
        const doc = view.doc();

        log(view.calls.includes("audio.level"), "启动后开始采样声音");
        const sampled = view.calls.filter((name) => name === "audio.level").length;
        log(sampled >= 3, `80ms 一拍，400ms 采到了 ${sampled} 次`);

        const box = doc.getElementById("wave-svg").viewBox.baseVal;
        const height = box.height;
        log(height > 0, `折线高度量出来了（${height}px）`);
        log(!doc.getElementById("wave").hidden, "有声音时折线是显示状态");

        const loud = newestY(doc);
        // 电平 0.5 落在上下各留 2px 的中线附近
        log(
          Math.abs(loud - height / 2) < 3,
          `电平 0.5 画在中线附近（y=${loud}, h=${height}）`,
        );

        // 突然安静：最新的点该落到基线上（底噪线在 h-2）
        view.setLevel(0);
        await sleep(400);
        /*
         * 高度要**重新量**：卡片里多一行少一行（进度条出现、提示条淡入）都会让
         * 折线那块跟着变高变矮。拿 400ms 前那个数去比，比的是两个不同的坐标系 ——
         * 全套一起跑的时候就是这么假红过一次。
         */
        const later = doc.getElementById("wave-svg").viewBox.baseVal.height;
        log(later === height, `折线高度在采样期间没跳（${height} → ${later}）`);
        const quiet = newestY(doc);
        log(
          Math.abs(quiet - (later - 2)) < 1.5,
          `没声音时贴着基线（y=${quiet}, 基线=${later - 2}）`,
        );
        view.frame.remove();
      }

      // ---- 13. 没有 audio:level 权限 ----
      {
        const view = mount({ session: PAUSED, level: "denied" });
        await view.ready;
        await sleep(200);
        const doc = view.doc();

        log(doc.getElementById("wave").hidden, "没授权时折线整条收起来");
        log(
          text(doc, "hint") === "Needs the Sound level permission",
          `提示说清楚缺哪一项「${text(doc, "hint")}」`,
        );
        // 歌曲本身照常显示：少了折线不该连播放控制一起废掉
        log(text(doc, "track") === "Ocean Drive", "折线没权限不影响曲目显示");
        log(!doc.getElementById("toggle").disabled, "折线没权限不影响按钮");
        const sampled = view.calls.filter((name) => name === "audio.level").length;
        await sleep(200);
        log(
          view.calls.filter((name) => name === "audio.level").length === sampled,
          "被拒之后不再反复问",
        );
        view.frame.remove();
      }

      // ---- 14. 关掉声音折线 ----
      {
        const view = mount({
          session: PAUSED,
          config: { pollMs: 2000, showProgress: true, showLevel: false },
        });
        await view.ready;
        await sleep(250);
        const doc = view.doc();

        log(doc.getElementById("wave").hidden, "开关关掉时折线不显示");
        log(!view.calls.includes("audio.level"), "开关关掉时一个采样都不发");

        view.setConfig({ pollMs: 2000, showProgress: true, showLevel: true });
        await sleep(250);
        log(!doc.getElementById("wave").hidden, "再打开时立刻回来");
        log(view.calls.includes("audio.level"), "再打开时开始采样");
        view.frame.remove();
      }

      const failed = lines.filter((line) => line.startsWith("FAIL")).length;
      document.getElementById("out").innerHTML =
        `<span class="${failed === 0 ? "ok" : "bad"}">pass=${lines.length - failed} fail=${failed}</span>\n` +
        lines
          .map((line) => `<span class="${line.startsWith("PASS") ? "ok" : "bad"}">${line}</span>`)
          .join("\n");
      window.__done = true;
    </script>
  </body>
</html>
