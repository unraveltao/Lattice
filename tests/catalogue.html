<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>catalogue test</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font: 12px/1.6 ui-monospace, monospace;
        padding: 16px;
      }
      .ok {
        color: #5dcaa5;
      }
      .bad {
        color: #f09595;
      }
    </style>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      /*
       * 组件目录（registry.json）的校验与安装计划。
       *
       * 这页钉六件事：
       *   1. 坏条目单独丢弃、不整包失败；整份不是目录才明确拒绝
       *   2. 相对地址按目录地址补全（少一个 `/` 就是全部 404）
       *   3. 安装计划的六种结论：装 / 更新 / 已最新 / 目录更旧 / 没签名 / 换人了 / 被拉黑
       *   4. "换人了"优先于"有新版本" —— 警告不能被包装成一次普通更新
       *   5. "被拉黑"优先于前两者 —— 拉黑是用户说过的话，不该被换钥匙绕过
       *   6. 多个目录源（0010）：id 怎么算、列表怎么归一化、同 id 谁赢、关掉的源去哪了
       */
      import {
        addedPermissions,
        DEMO_PUBLISHER_KEY,
        isBlockedKey,
        isDemoPublisherKey,
        isNewer,
        keyFingerprint,
        latestPackage,
        mergeCatalogues,
        normalizeKey,
        normalizeSources,
        parseCatalogue,
        pickPackage,
        planInstall,
        resolveCatalogueUrl,
        sourceIdFor,
        sourceLabel,
      } from "/src/runtime/catalogue.ts";

      const lines = [];
      const log = (pass, text) => lines.push((pass ? "PASS " : "FAIL ") + text);
      const eq = (actual, expected, text) =>
        log(
          JSON.stringify(actual) === JSON.stringify(expected),
          `${text}（得到 ${JSON.stringify(actual)}）`,
        );

      const KEY = "11".repeat(32);
      const OTHER_KEY = "44".repeat(32);
      const SIG = "22".repeat(64);
      const SHA = "33".repeat(32);
      const BASE = "http://127.0.0.1:1420/store/";

      const version = (over = {}) => ({
        version: "1.0.0",
        url: "packages/a.lattice",
        sha256: SHA,
        size: 1024,
        signature: SIG,
        permissions: ["clock"],
        ...over,
      });

      const entry = (over = {}) => ({
        id: "lattice.clock",
        name: "Clock",
        description: "A clock",
        author: "Lattice",
        publisher: { name: "Lattice", key: KEY },
        versions: [version()],
        ...over,
      });

      const doc = (over = {}) => ({
        schema: 1,
        name: "Test catalogue",
        updated: "2026-10-24",
        widgets: [entry()],
        ...over,
      });

      // ---- 1. 地址补全 ----
      eq(
        resolveCatalogueUrl(BASE, "packages/a.lattice"),
        "http://127.0.0.1:1420/store/packages/a.lattice",
        "相对地址按目录补全",
      );
      eq(
        resolveCatalogueUrl("http://x/store", "./packages/a.lattice"),
        "http://x/store/packages/a.lattice",
        "base 没有结尾斜杠也不拼错（`./` 被吃掉）",
      );
      eq(
        resolveCatalogueUrl(BASE, "https://cdn.example.com/a.lattice"),
        "https://cdn.example.com/a.lattice",
        "绝对地址原样保留",
      );

      // ---- 2. 正常目录 ----
      {
        const { catalogue, warnings } = parseCatalogue(
          doc({
            widgets: [
              entry({
                id: "lattice.todo",
                name: "Todo",
                versions: [version({ version: "1.0.0" }), version({ version: "1.2.0" })],
              }),
              entry(),
            ],
          }),
          BASE,
        );
        eq(warnings.length, 0, "干净的目录没有警告");
        eq(
          catalogue.entries.map((item) => item.id),
          ["lattice.clock", "lattice.todo"],
          "条目按名字排序",
        );
        const todo = catalogue.entries.find((item) => item.id === "lattice.todo");
        eq(todo.versions.map((item) => item.version), ["1.2.0", "1.0.0"], "版本按降序排好");
        eq(latestPackage(todo).version, "1.2.0", "最新版就是第一个");
        eq(
          catalogue.entries[0].versions[0].url,
          "http://127.0.0.1:1420/store/packages/a.lattice",
          "包地址已经补全成绝对地址",
        );
        eq(catalogue.entries[0].publisher.key, KEY, "公钥被保留");
      }

      /*
       * 双语的目录与条目：名字、说明、版本的 notes 都可以写成 `{ zh, en }`。
       *
       * 目录是**别人**发的，平台只负责原样留下两门、按当前语言挑一份 ——
       * 所以这里钉的是"形状别被压成字符串"，压掉了就只剩一门。
       */
      {
        const { catalogue, warnings } = parseCatalogue(
          doc({
            name: { zh: "测试目录", en: "Test catalogue" },
            widgets: [
              entry({
                id: "lattice.pet",
                name: { zh: "大肥鱼", en: "Big Fishy" },
                description: { zh: "一只桌宠", en: "A desktop pet" },
                versions: [version({ notes: { zh: "修了气泡", en: "Fixed the bubble" } })],
              }),
            ],
          }),
          BASE,
        );
        eq(warnings.length, 0, "双语目录没有警告");
        eq(catalogue.name, { zh: "测试目录", en: "Test catalogue" }, "目录名两门都留着");
        eq(
          catalogue.entries[0].name,
          { zh: "大肥鱼", en: "Big Fishy" },
          "条目名两门都留着（不会被压成字符串）",
        );
        eq(
          catalogue.entries[0].description,
          { zh: "一只桌宠", en: "A desktop pet" },
          "条目说明两门都留着",
        );
        eq(
          catalogue.entries[0].versions[0].notes,
          { zh: "修了气泡", en: "Fixed the bubble" },
          "版本的更新说明两门都留着",
        );
      }

      // ---- 3. 整份不是目录 ----

      eq(parseCatalogue({ schema: 2, widgets: [] }, BASE).catalogue, null, "schema 不认识 -> 拒绝");
      eq(parseCatalogue(null, BASE).catalogue, null, "不是对象 -> 拒绝");
      log(parseCatalogue({ schema: 2 }, BASE).warnings[0].includes("schema"), "拒绝时说明原因");

      // ---- 4. 坏条目单独丢弃 ----
      {
        const { catalogue, warnings } = parseCatalogue(
          doc({
            widgets: [
              entry({ id: "Clock" }), // 大写 id
              entry({ id: "lattice.badsha", versions: [version({ sha256: "zz" })] }),
              entry({
                id: "lattice.dupe",
                versions: [version({ version: "1.0.0" }), version({ version: "1.0.0" })],
              }),
              entry({ id: "lattice.clock" }),
              entry({ id: "lattice.clock" }),
            ],
          }),
          BASE,
        );
        eq(
          catalogue.entries.map((item) => item.id).sort(),
          ["lattice.clock", "lattice.dupe"],
          "非法 id / 坏 hash / 重复 id 的条目被丢掉，好的留着",
        );
        eq(
          catalogue.entries.find((item) => item.id === "lattice.dupe").versions.length,
          1,
          "重复版本只留一个",
        );
        log(warnings.some((line) => line.includes("illegal id")), "非法 id 有警告");
        log(warnings.some((line) => line.includes("sha256")), "坏 hash 有警告");
        log(warnings.some((line) => line.includes("duplicate entry")), "重复条目有警告");
      }

      // ---- 5. 权限白名单 ----
      {
        const { catalogue, warnings } = parseCatalogue(
          doc({ widgets: [entry({ versions: [version({ permissions: ["clock", "root", "clock"] })] })] }),
          BASE,
        );
        eq(
          catalogue.entries[0].versions[0].permissions,
          ["clock"],
          "未知权限被丢掉，重复的合并",
        );
        log(warnings.some((line) => line.includes("unknown permission")), "未知权限有警告");
      }

      // ---- 6. 安装计划 ----
      {
        const { catalogue } = parseCatalogue(
          doc({
            widgets: [
              entry({ versions: [version({ version: "1.0.0" }), version({ version: "1.2.0" })] }),
            ],
          }),
          BASE,
        );
        const clock = catalogue.entries[0];

        eq(planInstall(clock).kind, "install", "没装过 -> 安装");
        eq(planInstall(clock, { installedVersion: "1.0.0" }).kind, "update", "旧版本 -> 更新");
        eq(planInstall(clock, { installedVersion: "1.0.0" }).from, "1.0.0", "更新时带着原版本");
        eq(planInstall(clock, { installedVersion: "1.2.0" }).kind, "current", "已经最新");
        /*
         * 目录比本地旧。以前这一支也算 `current`，界面写 `Up to date` ——
         * 那句话在"我有 1.0.0、目录只到 0.9.0"的时候是假的。
         */
        eq(planInstall(clock, { installedVersion: "9.0.0" }).kind, "older", "目录更旧 -> older，不谎称已最新");
        eq(
          planInstall(clock, { installedVersion: "9.0.0" }).installed,
          "9.0.0",
          "older 带着本地那个版本，界面要说得清两边各是多少",
        );
        eq(
          planInstall(clock, { installedVersion: "1.0.0", pinnedKey: OTHER_KEY }).kind,
          "untrusted",
          "钥匙变了 -> untrusted",
        );
        eq(
          planInstall(clock, { installedVersion: "1.2.0", pinnedKey: OTHER_KEY }).kind,
          "untrusted",
          "钥匙变了优先于“已最新”",
        );
        eq(planInstall(clock, { pinnedKey: KEY }).kind, "install", "钥匙对得上就正常装");
        eq(planInstall(clock, { range: "^2" }), null, "范围里没有版本 -> null");
        eq(planInstall(clock, { range: "~1.0.0" }).pkg.version, "1.0.0", "按范围挑版本");

        const unsigned = parseCatalogue(
          doc({ widgets: [entry({ publisher: undefined })] }),
          BASE,
        ).catalogue.entries[0];
        eq(planInstall(unsigned).kind, "unsigned", "没有公钥 -> unsigned");

        const badKey = parseCatalogue(
          doc({ widgets: [entry({ publisher: { name: "x", key: "short" } })] }),
          BASE,
        ).catalogue.entries[0];
        eq(planInstall(badKey).kind, "unsigned", "公钥形状不对也算没签名");
      }

      // ---- 6c. 拉黑发布者 ----
      {
        const { catalogue } = parseCatalogue(
          doc({
            widgets: [
              entry({ versions: [version({ version: "1.0.0" }), version({ version: "1.2.0" })] }),
            ],
          }),
          BASE,
        );
        const clock = catalogue.entries[0];

        eq(normalizeKey(KEY.toUpperCase()), KEY, "归一化：大写摊平");
        eq(normalizeKey("11:11 11"), "111111", "归一化：分隔符去掉，只留 hex");
        eq(normalizeKey(""), "", "归一化：空串还是空串");
        eq(isBlockedKey(KEY, []), false, "空名单不拦任何人");
        eq(isBlockedKey(KEY, null), false, "名单没给也不拦");
        eq(isBlockedKey(KEY, [KEY]), true, "同一把钥匙命中");
        eq(isBlockedKey(KEY.toUpperCase(), [KEY]), true, "大小写不同也算命中");
        eq(isBlockedKey(OTHER_KEY, [KEY]), false, "别的钥匙不误伤");
        eq(isBlockedKey("", [""]), false, "空钥匙不会被空名单项命中");

        /*
         * 内置目录用公开的演示钥匙签，远端目录用发布者自己的钥匙。钉住前者会在
         * 切源时弹一次"换人了"——那是一次没发生过的换人，所以它不算身份。
         */
        eq(isDemoPublisherKey(DEMO_PUBLISHER_KEY), true, "演示钥匙认得出来");
        eq(isDemoPublisherKey(DEMO_PUBLISHER_KEY.toUpperCase()), true, "大写写法也认得出来");
        eq(isDemoPublisherKey(KEY), false, "发布者自己的钥匙不是演示钥匙");
        eq(isDemoPublisherKey(""), false, "空钥匙不是演示钥匙");
        eq(isDemoPublisherKey(null), false, "没有钉子的时候不报错");
        eq(isDemoPublisherKey(undefined), false, "undefined 也不报错");

        eq(planInstall(clock, { blockedKeys: [KEY] }).kind, "blocked", "拉黑 -> 不装");
        eq(planInstall(clock, { blockedKeys: [KEY] }).key, KEY, "blocked 带着那把钥匙，界面要能解黑");
        eq(
          planInstall(clock, { blockedKeys: [KEY] }).pkg.version,
          "1.2.0",
          "blocked 也带出版本 —— 卡片上仍要说清是哪一版被挡了",
        );
        /*
         * 顺序：拉黑必须压过"有新版本"和"换人了"。
         * 反过来的话，一把被拉黑的旧钥匙换了个新钥匙，卡片会给用户一个
         * "信任新钥匙并安装"的按钮 —— 拉黑的意图被一次换钥匙绕过。
         */
        eq(
          planInstall(clock, { blockedKeys: [KEY], installedVersion: "1.0.0" }).kind,
          "blocked",
          "拉黑优先于更新",
        );
        eq(
          planInstall(clock, { blockedKeys: [KEY], pinnedKey: OTHER_KEY }).kind,
          "blocked",
          "拉黑优先于换钥匙确认",
        );
        eq(
          planInstall(clock, { blockedKeys: [OTHER_KEY], pinnedKey: KEY }).kind,
          "install",
          "拉黑的不是这把钥匙 -> 照常",
        );
        eq(
          planInstall(clock, { blockedKeys: [], installedVersion: "1.0.0" }).kind,
          "update",
          "名单为空 -> 照常更新",
        );
      }

      // ---- 6b. 目录级发布者 ----
      {
        const inherited = parseCatalogue(
          { ...doc({ widgets: [entry({ publisher: undefined })] }), publisher: { name: "Lattice", key: KEY } },
          BASE,
        );
        eq(
          inherited.catalogue.entries[0].publisher?.key,
          KEY,
          "条目没写公钥时继承目录级的那把",
        );

        const overridden = parseCatalogue(
          {
            ...doc({ widgets: [entry({ publisher: { name: "Someone", key: OTHER_KEY } })] }),
            publisher: { name: "Lattice", key: KEY },
          },
          BASE,
        );
        eq(
          overridden.catalogue.entries[0].publisher?.key,
          OTHER_KEY,
          "条目自己的公钥优先于目录级",
        );

        const none = parseCatalogue(doc({ widgets: [entry({ publisher: undefined })] }), BASE);
        eq(none.catalogue.entries[0].publisher, null, "两边都没有就是没签名");
      }

      // ---- 7. 新增权限 ----
      eq(
        addedPermissions(["clock"], ["clock", "network"]),
        ["network"],
        "多要的权限只有 network",
      );
      eq(addedPermissions(["clock"], ["clock"]), [], "没多要就是空");
      eq(addedPermissions([], ["storage"]), ["storage"], "从零到有");
      eq(
        addedPermissions(["clock", "storage"], ["network", "clock"]),
        ["network"],
        "顺序跟着新清单走，且已撤掉的不算新增",
      );

      // ---- 8. 指纹 ----
      eq(keyFingerprint(KEY), "1111 1111 1111 1111", "指纹取前 16 位、四段一组");
      eq(keyFingerprint("abc"), "abc", "太短就原样返回");

      // ---- 9. 版本比较薄包装 ----
      log(isNewer("1.2.0", "1.0.0"), "isNewer 认得出新版本");
      log(!isNewer("1.0.0", "1.0.0"), "同版本不是更新");
      log(!isNewer("bad", "1.0.0"), "写坏的版本不当成更新");

      // ---- 10. 目录源：地址 → 稳定 id（0010） ----
      eq(
        sourceIdFor("https://example.com/lattice/registry.json"),
        "src-example-com-lattice-registry-json",
        "id 取地址的头一段，协议与标点都压掉",
      );
      eq(
        sourceIdFor("HTTPS://Example.COM/lattice/registry.json"),
        "src-example-com-lattice-registry-json",
        "同一个地址换个大小写还是同一个 id",
      );
      eq(sourceIdFor(""), "src", "空地址也退成一个能用的 id，不返回空串");
      {
        const long = sourceIdFor(`https://example.com/${"a".repeat(80)}.json`);
        log(long.startsWith("src-example-com-") && long.length <= 44, `长地址截到 40 个字符（得到 ${long.length + 4} 字符）`);
      }

      // ---- 11. 源列表归一化 ----
      const OFFICIAL = "https://official.example/registry.json";
      eq(
        normalizeSources(null, OFFICIAL).map((item) => [item.id, item.url]),
        [["official", OFFICIAL]],
        "没有列表时补一份官方源",
      );
      eq(normalizeSources([], OFFICIAL)[0].url, OFFICIAL, "空列表补的那份用的是调用方给的官方地址");
      eq(
        normalizeSources([{ kind: "url", url: "https://a.example/r.json" }], OFFICIAL).map((item) => [
          item.id,
          item.enabled,
        ]),
        [["src-a-example-r-json", true]],
        "地址决定 id，默认启用",
      );
      eq(
        normalizeSources(
          [
            { kind: "url", url: "https://a.example/r.json" },
            { kind: "url", url: "https://a.example/r.json" },
          ],
          OFFICIAL,
        ).length,
        1,
        "同一个地址加两次只留第一份",
      );
      eq(
        normalizeSources(
          [
            { kind: "url", url: "https://a.example/r.json" },
            { kind: "url", url: "https://b.example/r.json" },
          ],
          OFFICIAL,
        ).map((item) => item.id),
        ["src-a-example-r-json", "src-b-example-r-json"],
        "两个不同的源各自一个 id、顺序照输入走",
      );
      eq(
        normalizeSources([{ kind: "url", url: "https://a.example/r.json", enabled: false }], OFFICIAL)[0]
          .enabled,
        false,
        "关掉的源照样留在列表里（只是不参与合并）",
      );
      eq(
        normalizeSources([{ kind: "url", url: "https://a.example/r.json", id: "same" }, { kind: "url", url: "https://b.example/r.json", id: "same" }], OFFICIAL).map((item) => item.id),
        ["same", "same-2"],
        "id 撞了就加后缀（它是 React key，重复会让卡片串成一张）",
      );

      // ---- 12. 合并：同一个 id 先到先得 ----
      const snapshotOf = (id, url, name, widgets, enabled = true) => ({
        source: { id, kind: "url", url, enabled },
        catalogue: parseCatalogue(doc({ name, widgets }), BASE).catalogue,
        warnings: [],
        error: null,
        origin: url,
        at: 0,
        notice: null,
      });

      {
        const first = snapshotOf("a", "https://a.example/r.json", "Alpha", [entry()]);
        const second = snapshotOf("b", "https://b.example/r.json", "Beta", [entry()]);
        const merged = mergeCatalogues([first, second]);
        eq(merged.entries.length, 1, "两个源都有同一个 id 时只出一张卡");
        eq(merged.entries[0].sourceId, "a", "生效的是列表里靠前的那个源");
        eq(merged.entries[0].alsoIn, ["Beta"], "被盖住的那个源要能被说出来");
        eq(
          merged.conflicts,
          [{ id: "lattice.clock", winner: "Alpha", shadowed: ["Beta"] }],
          "冲突记的是名字，不是 id —— 那句话是给人看的",
        );
      }

      {
        const first = snapshotOf("a", "https://a.example/r.json", "Alpha", [entry()]);
        const off = snapshotOf("b", "https://b.example/r.json", "Beta", [entry({ id: "lattice.todo" })], false);
        const merged = mergeCatalogues([first, off]);
        eq(merged.entries.map((item) => item.id), ["lattice.clock"], "关掉的源整个不进合并");
        eq(merged.conflicts, [], "关掉的源也不会被报成冲突");
      }

      {
        const first = snapshotOf("a", "https://a.example/r.json", "Alpha", [entry()]);
        const second = snapshotOf("b", "https://b.example/r.json", "Beta", [entry({ id: "lattice.todo" })]);
        const merged = mergeCatalogues([first, second]);
        eq(merged.entries.length, 2, "id 不撞时两个源的东西都在");
        eq(merged.entries.every((item) => (item.alsoIn ?? []).length === 0), true, "没撞就不写 alsoIn");
        eq(merged.conflicts, [], "没撞就没有冲突行");
      }

      eq(
        sourceLabel({ source: { id: "src-x", kind: "url", url: "", enabled: true }, catalogue: null }),
        "src-x",
        "读不到的源退回用 id 当名字",
      );

      document.getElementById("out").innerHTML = lines
        .map((line) => `<span class="${line.startsWith("PASS") ? "ok" : "bad"}">${line}</span>`)
        .join("\n");
      window.__done = true;
    </script>
  </body>
</html>
