<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>sdk test</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font: 12px/1.6 ui-monospace, monospace;
        padding: 16px;
      }
      .ok {
        color: #5dcaa5;
      }
      .bad {
        color: #f09595;
      }
      iframe {
        width: 260px;
        height: 120px;
        border: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <pre id="out">running…</pre>
    <iframe id="child"></iframe>
    <script type="module">
      /*
       * @lattice/sdk 的契约。
       *
       * 这一页钉的是"组件作者依赖的那些行为"，不是 SDK 的内部实现：
       *   - `await ready` 之后配置和主题已经就位（第一次渲染就是对的）
       *   - 失败的调用一律 reject 一个带 `code` 的 LatticeError，不是裸 Error
       *   - 宿主推来的 theme / config-changed / tick / store-changed / language 都能收到
       *   - 心跳返回 `{ id, stop }`，stop 之后不再触发
       *   - 宿主不在了（顶层窗口）时立刻失败，不会干等三秒
       *
       * 为什么要专门测这些：SDK 是**唯一**一份组件作者会拷进自己目录的代码，
       * 它出错的表现是"某个组件偶尔不刷新"，从组件那边完全看不出来原因。
       *
       * 假宿主就写在下面：它按 WIDGET_SPEC 的消息格式回话，别的什么都不做。
       */

      const lines = [];
      const log = (pass, text) => lines.push((pass ? "PASS " : "FAIL ") + text);
      const eq = (actual, expected, text) =>
        log(
          JSON.stringify(actual) === JSON.stringify(expected),
          `${text}（得到 ${JSON.stringify(actual)}）`,
        );

      /**
       * 等一个条件成立，最多等 timeout 毫秒。
       *
       * 用于**跨窗口**的消息：`postMessage` 是一条宏任务，而 `await` 一个
       * 子窗口的 promise 只排微任务 —— 微任务先跑完，所以"子页面已经发了
       * ready"不代表"父页面的监听器已经收到"。直接断言会偶发失败（实测在
       * 整套测试一起跑、机器忙的时候漏过一次）。
       */
      async function waitFor(predicate, timeout = 1000) {
        const deadline = Date.now() + timeout;
        while (Date.now() < deadline) {
          if (predicate()) return true;
          await new Promise((resolve) => setTimeout(resolve, 10));
        }
        return predicate();
      }

      // ---------------------------------------------------------------------
      // 假宿主
      // ---------------------------------------------------------------------

      const received = [];
      const store = {};
      const timers = [];
      let timerSeq = 0;
      let readyCount = 0;
      let child = null;
      /*
       * 组件回给"模型"的那几条话（`agent-result`）。
       *
       * 它们和请求/响应走同一个 postMessage 通道，只是**反方向**：宿主发
       * `agent-call` 进去，组件把 `agent-result` 发回来。所以假宿主这一侧
       * 得在"只处理 request"之前把它捞出来。
       */
      const agentReplies = [];

      function reply(source, id, body) {
        source.postMessage({ __lattice: 1, type: "response", id, ...body }, "*");
      }

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || typeof data !== "object" || data.__lattice !== 1) return;

        if (data.type === "ready") {
          readyCount += 1;
          return;
        }
        if (data.type === "agent-result") {
          agentReplies.push(data.payload);
          return;
        }
        if (data.type !== "request") return;

        received.push({ method: data.method, params: data.params });
        const { id, method, params } = data;
        const source = event.source;

        switch (method) {
          case "config.get":
            reply(source, id, { ok: true, result: { hour12: true, showSeconds: false } });
            return;
          case "theme.get":
            reply(source, id, {
              ok: true,
              result: { "--lattice-text": "rgb(238, 238, 238)", "--lattice-surface": "rgb(17, 17, 17)" },
            });
            return;
          case "clock.now":
            reply(source, id, { ok: true, result: { epochMs: 1700000000000, timeZone: "UTC" } });
            return;
          case "lang.get":
            reply(source, id, { ok: true, result: { lang: "zh", locale: "zh-CN" } });
            return;
          case "storage.set":
            store[params.key] = params.value;
            reply(source, id, { ok: true, result: { ok: true } });
            return;
          case "storage.get":
            reply(source, id, { ok: true, result: params.key in store ? store[params.key] : null });
            return;
          case "storage.remove":
            delete store[params.key];
            reply(source, id, { ok: true, result: { ok: true } });
            return;
          case "schedule.every": {
            const grant = { id: ++timerSeq };
            timers.push(grant.id);
            reply(source, id, { ok: true, result: grant });
            return;
          }
          case "schedule.clear":
            reply(source, id, { ok: true, result: { ok: true } });
            return;
          case "window.close":
            // 真宿主会关掉这个窗口；假宿主只回 ok，后面还有断言要跑
            reply(source, id, { ok: true, result: { ok: true } });
            return;
          case "network.fetch":
            reply(source, id, {
              ok: true,
              result: { status: 200, ok: true, headers: [], body: "{}", truncated: false },
            });
            return;
          case "media.get":
            reply(source, id, { ok: true, result: null });
            return;
          case "assistant.ask": {
            const last = params && Array.isArray(params.messages) ? params.messages[params.messages.length - 1] : null;
            const slow = Boolean(last && last.content === "slow");
            const result = slow
              ? { text: "慢的那一轮也回来了", actions: [] }
              : { text: "挪好了", actions: [{ detail: "moveWidget", ok: true }] };
            if (slow) setTimeout(() => reply(source, id, { ok: true, result }), 200);
            else reply(source, id, { ok: true, result });
            return;
          }
          case "permission.check":
            reply(source, id, {
              ok: false,
              code: "permission_denied",
              error: "permission not granted: storage",
              permission: "storage",
            });
            return;
          case "never.answers":
            // 故意不回：验超时
            return;
          default:
            reply(source, id, { ok: false, code: "unknown_method", error: `unknown method ${method}` });
            return;
        }
      });

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // ---------------------------------------------------------------------
      // 启动子页面，等它加载完
      // ---------------------------------------------------------------------

      const frame = document.getElementById("child");
      frame.src = "/tests/sdk-child.html";
      // 等子页面把 SDK 装好；加个上限，免得子页面挂了这一页也跟着挂住
      for (let attempt = 0; attempt < 200; attempt += 1) {
        if (frame.contentWindow && frame.contentWindow.__childLoaded) break;
        await wait(20);
      }
      if (!frame.contentWindow || !frame.contentWindow.__childLoaded) {
        log(false, "子页面没有加载完成（后面的断言无从谈起）");
        document.getElementById("out").innerHTML = lines
          .map((line) => `<span class="${line.startsWith("PASS") ? "ok" : "bad"}">${line}</span>`)
          .join("\n");
        window.__done = true;
        throw new Error("sdk child never loaded");
      }
      child = frame.contentWindow;
      const sdk = child.__sdk;

      // ---- 1. 启动 ----
      await sdk.ready;
      eq(sdk.hosted, true, "在宿主里 hosted 为 true");
      eq(sdk.config, { hour12: true, showSeconds: false }, "await ready 之后配置已就位");
      eq(
        child.document.documentElement.style.getPropertyValue("--lattice-text"),
        "rgb(238, 238, 238)",
        "主题长名 --lattice-text 写进了 CSS 变量",
      );
      eq(
        child.document.documentElement.style.getPropertyValue("--fg"),
        "rgb(238, 238, 238)",
        "主题短名 --fg 也写了一份（组件可以直接用 var(--fg)）",
      );
      eq(sdk.language, { lang: "zh", locale: "zh-CN" }, "await ready 之后界面语言已就位");
      log(await waitFor(() => readyCount >= 1), "启动时向宿主报了一次 ready（宿主据此推主题和配置）");

      // ---- 2. 请求 / 响应配对 ----
      const now = await sdk.now();
      eq(now.epochMs, 1700000000000, "sdk.now() 拿到宿主的结果");
      log(
        received.some((entry) => entry.method === "clock.now"),
        "宿主确实收到了 clock.now 这条请求",
      );

      // ---- 3. 错误形状 ----
      let unknown = null;
      try {
        await sdk.call("does.not.exist");
      } catch (error) {
        unknown = error;
      }
      eq(unknown && unknown.code, "unknown_method", "未知方法 -> code 为 unknown_method");
      log(unknown instanceof child.__sdkApi.LatticeError, "错误是 LatticeError 实例，不是裸 Error");

      let denied = null;
      try {
        await sdk.call("permission.check");
      } catch (error) {
        denied = error;
      }
      eq(denied && denied.code, "permission_denied", "未授权 -> code 为 permission_denied");
      eq(denied && denied.permission, "storage", "未授权时带上缺的是哪一项权限");
      eq(child.__sdkApi.isPermissionDenied(denied), true, "isPermissionDenied 认得它");
      eq(child.__sdkApi.isPermissionDenied(unknown), false, "isPermissionDenied 不误判别的错误");

      // ---- 4. 存储 ----
      await sdk.storage.set("note", "hello");
      eq(await sdk.storage.get("note"), "hello", "storage 写入后读得回来");
      await sdk.storage.remove("note");
      eq(await sdk.storage.get("note"), null, "storage.remove 之后读到 null");

      const storeKeys = [];
      const offStore = sdk.storage.onChange((key) => storeKeys.push(key));
      frame.contentWindow.postMessage({ __lattice: 1, type: "store-changed", payload: { key: "note" } }, "*");
      await wait(30);
      eq(storeKeys, ["note"], "store-changed 推到 storage.onChange");
      offStore();
      frame.contentWindow.postMessage({ __lattice: 1, type: "store-changed", payload: { key: "other" } }, "*");
      await wait(30);
      eq(storeKeys, ["note"], "off() 之后不再收到推送");

      // ---- 5. 配置与主题推送 ----
      const configs = [];
      sdk.on("config", (value) => configs.push(value));
      frame.contentWindow.postMessage(
        { __lattice: 1, type: "config-changed", payload: { config: { hour12: false } } },
        "*",
      );
      await wait(30);
      eq(configs.length, 1, "config-changed 推到 on(\"config\")");
      eq(sdk.config, { hour12: false }, "推送之后 sdk.config 换成新值");

      const themes = [];
      sdk.on("theme", (tokens) => themes.push(tokens));
      frame.contentWindow.postMessage(
        { __lattice: 1, type: "theme", payload: { "--lattice-text": "rgb(1, 2, 3)" } },
        "*",
      );
      await wait(30);
      eq(themes.length, 1, "theme 推到 on(\"theme\")");
      eq(
        child.document.documentElement.style.getPropertyValue("--fg"),
        "rgb(1, 2, 3)",
        "推送的主题当场写到 CSS 变量上",
      );

      /*
       * ---- 5.1 语言 ----
       *
       * 作者写的中英文由组件自己挑，所以 SDK 必须把"现在是哪一门"送到手上：
       * 启动时拉一次（`lang.get`），用户中途换语言靠推送。
       */
      log(
        received.some((entry) => entry.method === "lang.get"),
        "启动时拉了一次 lang.get（不是只等推送）",
      );
      const spoken = [];
      sdk.on("language", (info) => spoken.push(info));
      frame.contentWindow.postMessage(
        { __lattice: 1, type: "language", payload: { lang: "en", locale: "en-US" } },
        "*",
      );
      await wait(30);
      eq(spoken.length, 1, "language 推到 on(\"language\")");
      eq(sdk.language, { lang: "en", locale: "en-US" }, "推送之后 sdk.language 换成新值");
      frame.contentWindow.postMessage(
        { __lattice: 1, type: "language", payload: { lang: "fr" } },
        "*",
      );
      await wait(30);
      eq(sdk.language.lang, "en", "认不出的语言留着上一份，不会变成 undefined");
      eq(sdk.language.locale, "en-US", "同一条推送里缺的字段也留着上一份");

      // ---- 6. 心跳 ----
      const ticks = [];
      const timer = await sdk.schedule.every(1000, (payload) => ticks.push(payload.id));
      eq(typeof timer.id, "number", "schedule.every 返回宿主分配的订阅号");
      frame.contentWindow.postMessage({ __lattice: 1, type: "tick", payload: { id: timer.id, at: 1 } }, "*");
      await wait(30);
      eq(ticks, [timer.id], "收到自己那条心跳");
      frame.contentWindow.postMessage({ __lattice: 1, type: "tick", payload: { id: timer.id + 99 } }, "*");
      await wait(30);
      eq(ticks, [timer.id], "别的订阅号的心跳不会触发自己的回调");
      await timer.stop();
      frame.contentWindow.postMessage({ __lattice: 1, type: "tick", payload: { id: timer.id } }, "*");
      await wait(30);
      eq(ticks, [timer.id], "stop() 之后不再触发");
      log(
        received.some((entry) => entry.method === "schedule.clear"),
        "stop() 会让宿主把这条订阅清掉",
      );

      // ---- 7. 透传类方法 ----
      const net = await sdk.network.fetch({ url: "https://example.com/x", headers: { accept: "application/json" } });
      eq(net.status, 200, "network.fetch 把结果原样交回");
      const sentHeaders = received.filter((entry) => entry.method === "network.fetch").pop();
      eq(
        sentHeaders && sentHeaders.params.headers,
        { accept: "application/json" },
        "network.fetch 把 headers 当普通对象传下去",
      );
      eq(await sdk.media.get(), null, "media.get 没有会话时返回 null（不是错误）");

      /*
       * ---- 7.1 借平台的手 ----
       *
       * `assistant.ask` 是唯一一条"天生慢"的路：平台那边要跑一整轮带工具的
       * 对话（最多 6 次模型往返），按 180 秒算。默认的 3 秒会把它误判成"宿主
       * 没响应"，所以 SDK 给这一条单独一个超时。这一节钉两件事：参数形状
       * （`persona` 只在给了才发），以及慢一轮不会被默认超时砍断。
       */
      const asked = await sdk.assistant.ask({
        messages: [{ role: "user", content: "把时钟挪到右上角" }],
        persona: "你是一只桌宠",
      });
      eq(asked.text, "挪好了", "assistant.ask 把模型那句回话原样交回");
      eq(asked.actions, [{ detail: "moveWidget", ok: true }], "actions 是这次真做了什么");
      const askReq = received.filter((entry) => entry.method === "assistant.ask").pop();
      eq(
        askReq && askReq.params.messages,
        [{ role: "user", content: "把时钟挪到右上角" }],
        "messages 原样传下去",
      );
      eq(askReq && askReq.params.persona, "你是一只桌宠", "persona 跟着请求一起下去");

      await sdk.assistant.ask({ messages: [{ role: "user", content: "在吗" }] });
      const bareAsk = received.filter((entry) => entry.method === "assistant.ask").pop();
      log(
        Boolean(bareAsk) && !("persona" in bareAsk.params),
        "没给人设时请求里不带 persona 字段（而不是发一个空串）",
      );

      const tight = child.__createLattice({ timeout: 50, bootTimeout: 400 });
      const waited = await tight.assistant.ask({ messages: [{ role: "user", content: "slow" }] });
      eq(
        waited.text,
        "慢的那一轮也回来了",
        "assistant.ask 不跟实例的短超时走（200ms 的一轮在 timeout: 50 下照样回来）",
      );

      /*
       * ---- 7.2 让模型调你的组件（`agentTools`）----
       *
       * v0.11 的数据平面把"组件把能力声明成工具"做完了，但 SDK 那一侧一直
       * 没收口：作者得自己听原始 postMessage、自己拼 `{ ok, result }` 信封、
       * 自己保证"一定回话"。这一节钉的就是那层壳的三条承诺：
       *   1. 返回值就是 `result`，抛错就是 `ok:false`（不用拼信封）
       *   2. 没注册的名字回 `unknown tool`，而不是让平台干等 8 秒
       *   3. 异步处理器也接；回话永远带回同一个 `callId`
       */
      eq(typeof sdk.agentTools, "function", "SDK 有 agentTools（v0.11 留下的缺口之一）");
      const callAgent = (callId, tool, args) =>
        frame.contentWindow.postMessage(
          { __lattice: 1, type: "agent-call", payload: { callId, tool, args } },
          "*",
        );
      const lastAgent = () => agentReplies[agentReplies.length - 1];

      const offTools = sdk.agentTools({
        echo: (args) => ({ text: String(args.text ?? "") }),
        boom: () => {
          throw new Error("the list is locked");
        },
        quietly: () => undefined,
        slowly: () => new Promise((resolve) => setTimeout(() => resolve({ waited: true }), 30)),
      });

      callAgent("c1", "echo", { text: "hi" });
      log(await waitFor(() => agentReplies.length >= 1), "agentTools 挂上的工具收到了 agent-call");
      eq(
        lastAgent(),
        { callId: "c1", ok: true, result: { text: "hi" } },
        "返回值就是 result，callId 原样带回",
      );

      callAgent("c2", "boom");
      await waitFor(() => agentReplies.length >= 2);
      eq(
        lastAgent(),
        { callId: "c2", ok: false, error: "the list is locked" },
        "处理器抛错 → ok:false + 那句 message（作者不用拼信封）",
      );

      callAgent("c3", "quietly");
      await waitFor(() => agentReplies.length >= 3);
      eq(
        lastAgent(),
        { callId: "c3", ok: true, result: null },
        "没有返回值 → result 是 null（不是少一个字段的坏回话）",
      );

      callAgent("c4", "slowly");
      await waitFor(() => agentReplies.length >= 4, 2000);
      eq(
        lastAgent(),
        { callId: "c4", ok: true, result: { waited: true } },
        "异步处理器也接：等它回来再回话",
      );

      callAgent("c5", "nope");
      await waitFor(() => agentReplies.length >= 5);
      log(
        lastAgent()?.ok === false && /unknown tool/.test(String(lastAgent()?.error)),
        "没注册的工具名回 unknown tool（而不是让平台干等 8 秒）",
      );

      offTools();
      callAgent("c6", "echo", { text: "again" });
      await waitFor(() => agentReplies.length >= 6);
      log(
        lastAgent()?.ok === false && /unknown tool/.test(String(lastAgent()?.error)),
        "off() 之后那个名字不再接单",
      );

      // ---- 8. 超时 ----
      const short = child.__createLattice({ timeout: 60, bootTimeout: 60 });
      let timedOut = null;
      try {
        await short.call("never.answers");
      } catch (error) {
        timedOut = error;
      }
      log(
        Boolean(timedOut) && /timed out/.test(timedOut.message),
        "宿主不回话时按 timeout 拒绝（而不是永远挂着）",
      );

      // ---- 9. 不在宿主里 ----
      // 父页面自己的 window.parent === window，所以这份 hosted 为 false
      const { createLattice } = await import("/packages/sdk/lattice.js");
      const detached = createLattice({ bootTimeout: 50 });
      eq(detached.hosted, false, "顶层窗口里 hosted 为 false");
      let detachedError = null;
      try {
        await detached.call("clock.now");
      } catch (error) {
        detachedError = error;
      }
      log(
        Boolean(detachedError) && detachedError.code === "internal",
        "不在宿主里时调用立刻失败，不干等超时",
      );
      await detached.ready;
      eq(detached.language.lang, "en", "不在宿主里时按浏览器语言猜一门（这一页钉的是 en-US）");

      // ---- 10. 监听器互不影响 ----
      const hits = [];
      sdk.on("theme", () => {
        throw new Error("listener blew up");
      });
      sdk.on("theme", () => hits.push("second"));
      frame.contentWindow.postMessage({ __lattice: 1, type: "theme", payload: { "--lattice-text": "rgb(9, 9, 9)" } }, "*");
      await wait(30);
      eq(hits, ["second"], "一个监听器抛错不影响其它监听器");

      // ---- 11. 收尾 ----
      await sdk.close();
      log(
        received.some((entry) => entry.method === "window.close"),
        "sdk.close() 走 window.close 桥方法（只关窗口，不删 placement）",
      );

      document.getElementById("out").innerHTML = lines
        .map((line) => `<span class="${line.startsWith("PASS") ? "ok" : "bad"}">${line}</span>`)
        .join("\n");
      window.__done = true;
    </script>
  </body>
</html>
