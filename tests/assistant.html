<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>assistant test</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font: 12px/1.6 ui-monospace, monospace;
        padding: 16px;
      }
      .ok {
        color: #5dcaa5;
      }
      .bad {
        color: #f09595;
      }
    </style>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      /*
       * 内置 assistant 的纯逻辑。
       *
       * 这里不连模型、不发请求 —— 那两件事一条在 Rust（llm.rs / llm_policy.rs），
       * 一条要真 key。这一页钉的是**最容易悄悄错掉、又最难在真机上发现**的东西：
       *
       *   1. 工具表和动作白名单**逐字一致**（多一个 = 模型会调用一个执行器不认的动作，
       *      而它收到的是一条 `unknown_action`，然后开始猜）
       *   2. 每个工具的参数名和执行器读的键**对得上**（`readString` / `readNumber`
       *      用的是字面量，改名字两边不会互相提醒）
       *   3. 历史裁剪不留半截（system 必须留下，否则模型不知道桌面现状）
       *   4. 模型把 arguments 写成字符串 / 写成对象 / 写成垃圾时的行为
       *   5. 快照的预算：配置撑爆就整段丢掉，而不是把 token 账单一起撑爆
       */
      import {
        MAX_ABOUT_CHARS,
        MAX_ABOUT_ITEMS,
        MAX_ASK_CHARS,
        MAX_ASK_MESSAGES,
        MAX_CATALOGUE_ITEMS,
        MAX_HISTORY,
        MAX_PERSONA,
        MAX_STEPS,
        TOOL_SPECS,
        WIDGET_DENIED_ACTIONS,
        aboutLine,
        allTools,
        approvalFor,
        compactSnapshot,
        describeToolCall,
        normalizeAskMessages,
        parseArguments,
        parseAskMessages,
        systemPrompt,
        toWire,
        toolDefs,
        toolsFor,
        trimHistory,
      } from "../src/runtime/assistant.ts";
      import { AGENT_ACTIONS } from "../src/platform/agent.ts";
      import { APPROVAL_MODES, HANDS_OFF, approvalSummary, normalizeApproval } from "../src/runtime/hands.ts";
      import { widgetToolSources, widgetToolSpecs } from "../src/runtime/widget-tools.ts";

      const lines = [];
      const log = (pass, text) => lines.push((pass ? "PASS " : "FAIL ") + text);
      const eq = (actual, expected, text) =>
        log(JSON.stringify(actual) === JSON.stringify(expected), `${text}（得到 ${JSON.stringify(actual)}）`);
      const ok = (condition, text) => log(Boolean(condition), text);

      // ---- 1. 两张表必须一致 ----

      eq(
        Object.keys(TOOL_SPECS).slice().sort(),
        [...AGENT_ACTIONS].sort(),
        "工具名和 agent 动作白名单一致（多一个少一个都是 bug）",
      );

      // ---- 2. 参数名和执行器读的键对得上 ----

      /** 执行器 `runAgentAction` 里每个动作会读哪些键（照抄那份 switch） */
      const EXECUTOR_KEYS = {
        "placement.add": { strings: ["widgetId"], numbers: [], booleans: [] },
        "placement.move": { strings: ["instanceId"], numbers: ["x", "y"], booleans: [] },
        "placement.resize": { strings: ["instanceId"], numbers: ["w", "h"], booleans: [] },
        "placement.remove": { strings: ["instanceId"], numbers: [], booleans: [] },
        "placement.pin": { strings: ["instanceId"], numbers: [], booleans: ["pinned"] },
        "placement.front": { strings: ["instanceId"], numbers: [], booleans: [] },
        "theme.set": { strings: ["theme"], numbers: [], booleans: [] },
        "widgets.pause": { strings: [], numbers: [], booleans: ["paused"] },
      };

      for (const [name, keys] of Object.entries(EXECUTOR_KEYS)) {
        const spec = TOOL_SPECS[name];
        ok(!!spec, `${name} 有说明书`);
        if (!spec) continue;
        const properties = Object.keys(spec.parameters.properties).sort();
        const wanted = [...keys.strings, ...keys.numbers, ...keys.booleans].sort();
        eq(properties, wanted, `${name} 的 schema 键和执行器读的键一致`);
        eq([...(spec.parameters.required ?? [])].sort(), wanted, `${name} 的必填项就是全部参数`);
        for (const key of keys.strings) {
          eq(spec.parameters.properties[key].type, "string", `${name}.${key} 是字符串`);
        }
        for (const key of keys.numbers) {
          eq(spec.parameters.properties[key].type, "number", `${name}.${key} 是数字`);
        }
        for (const key of keys.booleans) {
          eq(spec.parameters.properties[key].type, "boolean", `${name}.${key} 是布尔`);
        }
        ok(spec.description.length > 20, `${name} 的描述够模型判断"什么时候用"`);
      }

      // `theme.set` 的枚举必须和 store 的 ThemeMode 一致
      eq(
        TOOL_SPECS["theme.set"].parameters.properties.theme.enum,
        ["light", "dark", "system"],
        "theme.set 只给三个合法值",
      );

      // ---- 3. 工具定义是 OpenAI 兼容的形状 ----

      const defs = toolDefs();
      eq(defs.length, AGENT_ACTIONS.length, "每个动作一个 function 定义");
      ok(
        defs.every((item) => item.type === "function" && item.function.name && item.function.parameters.type === "object"),
        "每个定义都是 {type:function, function:{name, parameters}}",
      );

      // ---- 4. 历史裁剪 ----

      const history = (count) =>
        Array.from({ length: count }, (_, index) => ({
          role: index === 0 ? "system" : index % 2 ? "user" : "assistant",
          content: `m${index}`,
        }));

      const short = history(4);
      eq(trimHistory(short), short, "没超上限时原样返回（而且是一份拷贝）");
      ok(trimHistory(short) !== short, "返回的是新数组，调用方改它不会污染原会话");

      const long = history(MAX_HISTORY + 12);
      const trimmed = trimHistory(long);
      eq(trimmed.length, MAX_HISTORY, "超长历史裁到上限");
      eq(trimmed[0].role, "system", "system 一定留下（桌面现状在里面）");
      ok(trimmed[1].content.includes("省略"), "被砍掉的部分有一句说明，模型不会以为对话刚开始");
      ok(
        trimmed.at(-1).content === long.at(-1).content,
        "留下的是**最近的**那些，不是最旧的",
      );

      // 字数预算：条数没超、但一条能顶几十条的时候，照样要砍
      const bulky = [
        { role: "system", content: "sys" },
        { role: "user", content: "x".repeat(400) },
        { role: "assistant", content: "y".repeat(400) },
        { role: "user", content: "最后一句" },
      ];
      const byChars = trimHistory(bulky, undefined, 200);
      ok(byChars.length < bulky.length, "字数超预算时裁掉旧消息");
      eq(byChars.at(-1).content, "最后一句", "最后一条永远留下（那是这一轮的问题）");
      ok(byChars[1].content.includes("省略"), "字数裁剪也留一句说明");
      eq(trimHistory(bulky, undefined, 10_000), bulky, "预算够时不许动历史");

      // ---- 5. 参数解析 ----

      eq(parseArguments('{"a":1}'), { ok: true, value: { a: 1 } }, "正常对象");
      eq(parseArguments(""), { ok: true, value: {} }, "空串当没有参数");
      ok(parseArguments("{oops").ok === false, "坏 JSON 要报错，交给模型改");
      ok(parseArguments("[1,2]").ok === false, "数组不是对象");
      ok(parseArguments("null").ok === false, "null 不是对象");
      ok(parseArguments('{"a":1}').value.a === 1, "值原样带出去");

      // ---- 6. 线格式 ----

      const wire = toWire([
        { role: "system", content: "sys" },
        { role: "user", content: "把时钟挪走" },
        {
          role: "assistant",
          content: "",
          toolCalls: [{ id: "call_1", name: "placement.move", arguments: '{"instanceId":"a","x":1,"y":2}' }],
        },
        { role: "tool", toolCallId: "call_1", content: '{"ok":true}' },
      ]);
      eq(wire[0], { role: "system", content: "sys" }, "system 原样");
      eq(wire[2].role, "assistant", "assistant 那条");
      ok(wire[2].content === null, "只调工具时 content 是 null（给空串有的供应商会拒）");
      eq(wire[2].tool_calls[0].type, "function", "tool_calls 带 type:function");
      eq(wire[2].tool_calls[0].function.name, "placement.move", "工具名原样");
      eq(wire[3], { role: "tool", tool_call_id: "call_1", content: '{"ok":true}' }, "工具结果带 tool_call_id");

      // ---- 7. 工具说明（界面上的小标签） ----

      ok(
        describeToolCall("placement.move", '{"instanceId":"lattice.clock#a1","x":1,"y":2}').includes("lattice.clock#a1"),
        "移动的标签带上实例 id",
      );
      ok(describeToolCall("theme.set", '{"theme":"dark"}').includes("dark"), "主题的标签带上目标");
      eq(describeToolCall("widgets.pause", '{"paused":true}'), "Pause every widget", "暂停");
      eq(describeToolCall("widgets.pause", '{"paused":false}'), "Resume every widget", "恢复");
      ok(describeToolCall("placement.pin", '{"instanceId":"a","pinned":true}').includes("Pin "), "钉住");
      ok(describeToolCall("placement.remove", "{bad json").includes("a widget"), "参数坏了也要出一个能看的标签");
      eq(describeToolCall("nope.nope", "{}"), "nope.nope", "未知动作原样显示，不崩");

      // ---- 8. 系统提示 ----

      const prompt = systemPrompt('{"placements":[]}');
      ok(prompt.includes("不要编造"), "要求它照快照里的 instanceId 说话");
      ok(prompt.includes("做不到"), "工具之外的事要明确拒绝");
      ok(prompt.includes("用用户的语言"), "工具描述是英文，回复跟用户走");
      ok(prompt.includes('{"placements":[]}'), "桌面现状被带进提示");

      // ---- 9. 快照与预算 ----

      const desk = {
        theme: "dark",
        paused: false,
        widgets: [
          { id: "lattice.clock", name: "Clock", installed: true },
          { id: "lattice.todo", name: "Todo", installed: false },
        ],
        placements: [
          {
            instanceId: "lattice.clock#a1",
            widgetId: "lattice.clock",
            name: "Clock",
            x: 24,
            y: 24,
            w: 240,
            h: 140,
            pinned: false,
            layer: "desktop",
            config: { hour12: false },
          },
        ],
      };

      const snapshot = JSON.parse(compactSnapshot(desk));
      eq(snapshot.placements.length, 1, "摆放都在");
      eq(snapshot.installed, [{ id: "lattice.clock", name: "Clock" }], "只列已安装的（没装的它也用不了）");
      eq(snapshot.placements[0].config, { hour12: false }, "配置带上（模型要回答“她怎么这么大”就得看见它）");

      // 预算：塞一坨配置进去，超预算之后整段 config 应当消失
      const fat = {
        ...desk,
        placements: [
          {
            ...desk.placements[0],
            config: Object.fromEntries(Array.from({ length: 400 }, (_, i) => [`key${i}`, "x".repeat(20)])),
          },
        ],
      };
      const squeezed = compactSnapshot(fat, 1000);
      ok(squeezed.length < 2000, "超预算时确实变小了");
      ok(!squeezed.includes('"config"'), "手段是把 config 整段丢掉，而不是砍一半 JSON");

      // ---- 10. 观察段（0003 §4）：组件说明首句 + 商店 ----

      // 说明首句：折成一行、按码点截、截断留一个省略号
      eq(aboutLine("第一行\n第二行\t缩进"), "第一行 第二行 缩进", "说明折成一行（作者写的是分段正文）");
      eq(aboutLine(undefined), "", "没写说明就是空串，不编一句");
      const longAbout = aboutLine("鱼".repeat(MAX_ABOUT_CHARS + 50));
      eq(Array.from(longAbout).length, MAX_ABOUT_CHARS, `说明截到 ${MAX_ABOUT_CHARS} 字`);
      ok(longAbout.endsWith("…"), "截断了要说出来（省略号）");
      eq(aboutLine("😀".repeat(MAX_ABOUT_CHARS)), "😀".repeat(MAX_ABOUT_CHARS), "正好到上限时不截");
      ok(
        !aboutLine("😀".repeat(MAX_ABOUT_CHARS + 1)).includes("\ufffd"),
        "按码点截，不把 emoji 切成半个（切开的那个是方框）",
      );

      // 快照里：已装的带 about，没装的不带；超过 8 个只列 8 个并报总数
      const manyWidgets = Array.from({ length: MAX_ABOUT_ITEMS + 3 }, (_, i) => ({
        id: `w${i}`,
        name: `W${i}`,
        installed: true,
        about: `第 ${i} 个组件的说明`,
      }));
      const observed = JSON.parse(
        compactSnapshot({
          theme: "dark",
          paused: false,
          widgets: [{ id: "lattice.clock", name: "Clock", installed: true, about: "点一下开始计时" }],
          placements: [],
        }),
      );
      eq(observed.installed, [
        { id: "lattice.clock", name: "Clock", about: "点一下开始计时" },
      ], "已装的组件带上说明首句（否则模型只能猜它能不能设成上海）");

      const plain = JSON.parse(
        compactSnapshot({
          theme: "dark",
          paused: false,
          widgets: [{ id: "lattice.pet", name: "Pet", installed: true }],
          placements: [],
        }),
      );
      eq(plain.installed, [{ id: "lattice.pet", name: "Pet" }], "没写说明的组件不带空的 about 字段");

      const capped = JSON.parse(
        compactSnapshot({ theme: "dark", paused: false, widgets: manyWidgets, placements: [] }),
      );
      eq(capped.installed.length, MAX_ABOUT_ITEMS, `最多带 ${MAX_ABOUT_ITEMS} 个组件的说明`);
      eq(capped.installedMore, 3, "超出的部分显式报总数（不说它就会以为桌面上就这 8 个）");

      // 商店：目录没加载时一个字都不提；加载了也明说"你装不了"
      const noShop = systemPrompt('{"x":1}');
      ok(!noShop.includes("商店里还能装这些"), "目录没加载就不提商店");
      const hinted = systemPrompt('{"x":1}', {
        catalogue: [{ id: "lattice.todo", name: "To-do" }],
      });
      ok(hinted.includes("lattice.todo"), "商店条目给了 id（用户自己装的时候要照着找）");
      ok(hinted.includes("你没有安装工具"), "明说它装不了，别回答“已经帮你装好了”");
      const manyShop = systemPrompt('{"x":1}', {
        catalogue: Array.from({ length: MAX_CATALOGUE_ITEMS + 2 }, (_, i) => ({
          id: `lattice.w${i}`,
          name: `W${i}`,
        })),
      });
      eq(
        (manyShop.match(/^- lattice\.w\d+ · /gm) ?? []).length,
        MAX_CATALOGUE_ITEMS,
        `商店最多列 ${MAX_CATALOGUE_ITEMS} 个`,
      );
      ok(manyShop.includes("还有 2 个没列出来"), "多出来的报个数，不假装只有这几个");

      // ---- 11. 组件借平台的手（`assistant.ask`）----

      // 工具表按调用方裁剪：组件那一轮没有 placement.remove，其余一个不少
      eq(Object.keys(toolsFor("platform")).sort(), Object.keys(TOOL_SPECS).sort(), "平台自己那一轮还是全部八个");
      const widgetTools = toolsFor("widget");
      ok(!("placement.remove" in widgetTools), "组件借手那一轮没有「移除组件」");
      eq(
        Object.keys(widgetTools).sort(),
        [...AGENT_ACTIONS].filter((name) => name !== "placement.remove").sort(),
        "除了 remove，别的动作都给",
      );
      eq(toolDefs(widgetTools).length, AGENT_ACTIONS.length - 1, "发给模型的 function 定义也跟着少一个");
      ok(WIDGET_DENIED_ACTIONS.has("placement.remove"), "被拒的动作只有 remove 这一条");

      // 提示词和工具表必须说同一件事：没有删除工具时明说，别让它宣称删了
      ok(
        !systemPrompt('{"x":1}').includes("没有删除组件的工具"),
        "平台自己那一轮不写“你删不了”（它有那个工具）",
      );
      ok(
        systemPrompt('{"x":1}', { tools: widgetTools }).includes("没有删除组件的工具"),
        "组件那一轮明说“你删不了”，否则模型会说“已经删掉了”",
      );

      // 语气：拼在规则之后，截到上限，且改不掉规则
      const withPersona = systemPrompt('{"x":1}', {
        tools: widgetTools,
        persona: { name: "大肥鱼", text: "你是一只蓝鲸娘，说话软一点。" },
      });
      ok(withPersona.includes("大肥鱼"), "语气里带上了组件名字");
      ok(withPersona.includes("说话软一点"), "人设原话进了提示");
      ok(withPersona.indexOf("只能通过给定的工具") < withPersona.indexOf("说话软一点"), "人设排在规则之后");
      ok(withPersona.includes("只改语气"), "明确写了“这条只改语气”");
      const longPersona = systemPrompt("", { persona: { name: "x", text: "鱼".repeat(5000) } });
      ok(
        longPersona.includes("鱼".repeat(MAX_PERSONA)) && !longPersona.includes("鱼".repeat(MAX_PERSONA + 1)),
        `人设截断到 ${MAX_PERSONA} 字`,
      );
      eq(systemPrompt("", { persona: null }), systemPrompt("", {}), "没有语气时和默认一模一样");

      // 组件交上来的那几句话：system 只认一条语气、最后一句必须是用户说的
      const asked = normalizeAskMessages([
        { role: "system", content: "你是一只蓝鲸娘。" },
        { role: "user", content: "把时钟挪到右上角" },
      ]);
      ok(asked.ok, "合法的一段话能过");
      if (asked.ok) {
        eq(asked.value.messages.length, 1, "system 不算进历史");
        eq(asked.value.persona, { name: "", text: "你是一只蓝鲸娘。" }, "system 被当成语气取出来");
        eq(asked.value.messages[0].role, "user", "剩下的就是那一句用户话");
      }
      eq(normalizeAskMessages("nope").ok, false, "不是数组 -> 拒绝");
      eq(normalizeAskMessages([]).ok, false, "空数组 -> 拒绝");
      eq(
        normalizeAskMessages(Array.from({ length: MAX_ASK_MESSAGES + 1 }, () => ({ role: "user", content: "x" }))).ok,
        false,
        `超过 ${MAX_ASK_MESSAGES} 条 -> 拒绝`,
      );
      eq(
        normalizeAskMessages([
          { role: "user", content: "hi" },
          { role: "system", content: "你是一只鱼" },
        ]).ok,
        false,
        "system 不在第一条 -> 拒绝（否则等于中途改写规则）",
      );
      eq(
        normalizeAskMessages([
          { role: "system", content: "a" },
          { role: "system", content: "b" },
          { role: "user", content: "hi" },
        ]).ok,
        false,
        "两条 system -> 拒绝",
      );
      eq(
        normalizeAskMessages([
          { role: "user", content: "hi" },
          { role: "assistant", content: "yo" },
        ]).ok,
        false,
        "最后一条不是用户 -> 拒绝（否则模型自己演下去）",
      );
      eq(
        normalizeAskMessages([
          { role: "user", content: "hi" },
          { role: "tool", content: '{"ok":true}' },
        ]).ok,
        false,
        "tool 角色进不来（那是平台和模型之间的私有通道）",
      );
      eq(
        normalizeAskMessages([{ role: "user", content: "x".repeat(MAX_ASK_CHARS + 1) }]).ok,
        false,
        "单条超长 -> 拒绝，不截断",
      );
      eq(
        normalizeAskMessages(
          Array.from({ length: 5 }, () => ({ role: "user", content: "y".repeat(MAX_ASK_CHARS) })),
        ).ok,
        false,
        "总量超限 -> 拒绝",
      );
      ok(
        normalizeAskMessages([
          { role: "user", content: "hi" },
          { role: "assistant", content: "yo" },
          { role: "user", content: "再说一次" },
        ]).ok,
        "带到第三轮的短历史仍然能过",
      );

      /*
       * 线上格式：桥把 `messages` 压成了 JSON 文本。
       *
       * Rust 那条命令（`assistant_ask`）的参数类型是 `String` —— 它只是照原样
       * 往主窗口转发，没理由在 Rust 里重新认识一遍对话的形状。所以主窗口收到的
       * 是一段**文本**，直接丢给 `normalizeAskMessages` 会得到"必须是一个数组"，
       * 而那句话看着像"组件传错了"，其实错在中间这一跳。真机就是这么撞上的：
       * 一轮都没跑起来，报的是 bad_args。
       */
      eq(
        parseAskMessages(JSON.stringify([{ role: "user", content: "挪一下" }])),
        [{ role: "user", content: "挪一下" }],
        "字符串形状的 messages 被解析回数组",
      );
      ok(parseAskMessages([{ role: "user", content: "x" }]) instanceof Array, "本来就是数组时原样放行");
      eq(parseAskMessages("not json"), null, "解析不了就交回 null（由 normalize 去说那句人话）");
      ok(
        normalizeAskMessages(parseAskMessages(JSON.stringify([{ role: "user", content: "挪一下" }]))).ok,
        "解析之后再 normalize 才是能跑的路径（这一条钉的正是真机那个坑）",
      );

      // ---- 0003 §3：审批档三档 ----
      //
      // 三档的判据只有一句话，但它决定三样东西：给模型什么工具、提示词怎么说、
      // 以及这一步到底跑不跑。三处不同源的症状是"它调了一个提示里说做不到的工具"，
      // 或者更糟："只读档里它居然改了桌面"。

      eq(APPROVAL_MODES, ["ask", "auto", "readonly"], "三档的名字就是磁盘上那三个字面量");
      eq(normalizeApproval("ReadOnly"), "readonly", "档名大小写不算区别");
      eq(normalizeApproval("  auto "), "auto", "前后空白不算区别");
      for (const junk of ["", "yes", "read-only", "off", "auto2"]) {
        eq(normalizeApproval(junk), "ask", `认不出来的档一律退回 ask（${JSON.stringify(junk)}）`);
      }

      eq(approvalFor("file.read", "ask"), "allow", "ask 档：读直接放行");
      eq(approvalFor("file.write", "ask"), "ask", "ask 档：写要点头");
      eq(approvalFor("placement.remove", "ask"), "ask", "ask 档：删组件要点头");
      eq(approvalFor("file.write", "auto"), "allow", "auto 档：写不问");
      eq(approvalFor("shell.run", "auto"), "allow", "auto 档：命令不问");
      eq(approvalFor("placement.remove", "auto"), "ask", "auto 档：删组件**仍然**问（那一步撤不回来）");
      eq(approvalFor("file.read", "readonly"), "allow", "只读档：读放行");
      eq(approvalFor("file.write", "readonly"), "deny", "只读档：写是**拒**不是问（再问一次等于把设置当建议）");
      eq(approvalFor("placement.remove", "readonly"), "deny", "只读档：桌面动作也拒");
      eq(approvalFor("mcp.a.b", "readonly"), "deny", "只读档：外部服务的工具一律拒");

      eq(Object.keys(toolsFor("platform", "readonly")), [], "只读档：桌面动作一个都不留（八个全都改状态）");
      eq(
        Object.keys(toolsFor("platform", "auto")).sort(),
        Object.keys(TOOL_SPECS).sort(),
        "auto 档的桌面表和默认一样（它靠裁决挡，不靠裁表）",
      );
      ok(
        !Object.keys(toolsFor("widget", "readonly")).includes("placement.move"),
        "只读档对组件借手那条路同样生效",
      );

      const roHands = { ...HANDS_OFF, files: true, shell: true, input: true, approvalMode: "readonly" };
      const roTable = allTools("platform", roHands);
      ok(!("file.write" in roTable), "只读档：写文件不在表里");
      ok(!("shell.run" in roTable), "只读档：跑命令不在表里");
      ok(!("input.click" in roTable), "只读档：点键鼠不在表里");
      ok("file.read" in roTable, "只读档：读文件还在");
      // 表里剩下的每一个都必须裁决为 allow，否则会出现"给了却调不动"
      for (const name of Object.keys(roTable)) {
        eq(approvalFor(name, "readonly"), "allow", `只读档的表里 ${name} 是能跑的`);
      }

      const roPrompt = systemPrompt("{}", { hands: roHands, tools: roTable });
      ok(roPrompt.includes("只读档"), "只读档的提示词自己说了现在是只读");
      ok(!roPrompt.includes("shell.run"), "只读档的提示词不提跑命令（表和话同源）");
      ok(!roPrompt.includes("file.write"), "只读档的提示词不提写文件");
      ok(!roPrompt.includes("每次都要点头"), "只读档不说「每次点头」这种做不到的话");

      const autoHands = { ...HANDS_OFF, files: true, input: true, approvalMode: "auto" };
      const autoPrompt = systemPrompt("{}", { hands: autoHands, tools: allTools("platform", autoHands) });
      ok(!autoPrompt.includes("每次都要点头"), "auto 档不再声称每次都要点头");
      ok(autoPrompt.includes("自动档"), "auto 档明说现在是自动档");
      const askHands = { ...HANDS_OFF, files: true };
      const askPrompt = systemPrompt("{}", { hands: askHands, tools: allTools("platform", askHands) });
      ok(askPrompt.includes("用户要当场点头"), "ask 档照旧写明写文件要点头");

      // ---- 0004：手与循环的上限 ----

      eq(MAX_STEPS, 24, "一轮的步数上限抬到 24（读→改→跑→再读，6 步收不了尾）");
      eq(
        Object.keys(allTools("platform")).sort(),
        Object.keys(TOOL_SPECS).sort(),
        "不传手时，整张表就是桌面那张（老路径一字不差）",
      );
      eq(
        Object.keys(allTools("widget")).sort(),
        Object.keys(toolsFor("widget")).sort(),
        "组件那张表不传手时和以前一样",
      );
      ok(
        !systemPrompt("{}", {}).includes("file.read"),
        "没开手时系统提示里没有任何工具名（否则模型会调一个它没被给的工具）",
      );

      // ---- 0003 §2 的数据平面：组件声明的工具怎么进表、怎么裁决 ----
      //
      // 三处必须同源：schema（组件自己声明的参数）、裁决（`approvalFor`）、提示词
      // 里那一段。少一样就是"能调但不该调"或者"表里有、提示里说做不到"。
      //
      // 判据那几条在 `tests/widget-tools.html` 里钉着（归一化、拆名字、选实例）；
      // 这里只钉**和 assistant 的接缝**：合表、裁决、提示。

      const todoSpec = { name: "add", description: "Add one item", params: { text: "string" }, required: ["text"] };
      const widgetSpecs = widgetToolSpecs(
        widgetToolSources([
          {
            instanceId: "todo#a",
            widgetId: "lattice.todo",
            title: "lattice.todo",
            tools: [todoSpec],
            installed: true,
            granted: true,
          },
        ]),
      );
      const withWidget = allTools("platform", HANDS_OFF, {}, widgetSpecs);
      ok("widget.lattice.todo.add" in withWidget, "组件工具进了这一轮的表");
      eq(withWidget["widget.lattice.todo.add"]?.parameters.required, ["text"], "schema 跟着组件声明走");
      eq(
        Object.keys(allTools("widget", HANDS_OFF, {}, widgetSpecs)).filter((name) => name.startsWith("widget.")),
        [],
        "组件借手那一轮**没有**组件工具：不然它能借平台去点另一个组件（那条路没有确认条）",
      );
      eq(approvalFor("widget.lattice.todo.add", "ask"), "ask", "ask 档：调组件工具要点头");
      eq(approvalFor("widget.lattice.todo.add", "auto"), "allow", "auto 档：不问");
      eq(
        approvalFor("widget.lattice.todo.add", "readonly"),
        "deny",
        "只读档：拒 —— 认不出来的名字一律按「会改东西」算",
      );
      eq(
        approvalSummary("widget.lattice.todo.add", {}),
        "Call widget.lattice.todo.add",
        "确认条上写清要调谁的工具",
      );
      ok(
        systemPrompt("desktop", { hands: HANDS_OFF, tools: withWidget }).includes("widget."),
        "提示词里说了这几种工具是组件自己声明的（不说的话规则 3「组件数据你碰不到」会和它打架）",
      );

      // ---- 「全部」模式（0009）----
      //
      // 模式是**另一个轴**，不是第四档：三档已经表达了问 / 不问 / 别改，模式管的是
      // "能碰什么"。三条例外钉在这里，因为它们都是静默出事的那一类：
      // `readonly` 优先、写自身配置仍然问、读自身配置不算提权。

      eq(approvalFor("file.write", "ask", { everything: true }), "allow", "全部模式：写不问");
      eq(approvalFor("shell.run", "ask", { everything: true }), "allow", "全部模式：命令不问");
      eq(
        approvalFor("placement.remove", "auto", { everything: true }),
        "allow",
        "全部模式：连删除也放行（撤销那 8 秒还在）",
      );
      eq(approvalFor("file.write", "readonly", { everything: true }), "deny", "全部模式盖不过只读档");
      eq(
        approvalFor("file.write", "ask", { everything: true, path: "C:\\app\\assistant.json" }),
        "ask",
        "全部模式：写自身配置仍然要问（能改自己权限文件的助手等于没有权限系统）",
      );
      eq(
        approvalFor("file.read", "ask", { everything: true, path: "C:\\app\\assistant.json" }),
        "allow",
        "全部模式：读自身配置不算提权",
      );
      eq(
        approvalFor("widget.lattice.todo.add", "ask", { everything: true }),
        "allow",
        "全部模式：组件声明的工具一样不问",
      );
      eq(approvalFor("file.write", "ask"), "ask", "不给第三参数时，行为和以前一模一样");

      // ---- 输出 ----

      const pass = lines.filter((line) => line.startsWith("PASS")).length;
      const fail = lines.length - pass;
      document.getElementById("out").innerHTML =
        lines.map((line) => `<span class="${line.startsWith("PASS") ? "ok" : "bad"}">${line}</span>`).join("\n") +
        `\n\n${pass} passed, ${fail} failed`;
      document.title = fail === 0 ? `assistant ${pass}/${lines.length}` : `assistant FAIL ${fail}`;
    </script>
  </body>
</html>
