<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lattice Companion</title>
    <!--
      样式内联而不是单独一个 .css：这一页总共三条规则，而且它们全是"让画布铺满、
      背景透明"——那不是设计令牌能表达的东西。`check:tokens` 扫的是 src/**/*.css，
      为三条 reset 造一个文件只会让那道检查多扫一个没内容的文件。
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 区域窗必须逐像素透明：不透明的话区域之内没被画到的像素会被
           WebView2 用窗口底色填上，浅色壁纸上就是她周围一圈黑框。 */
        background: transparent;
        /* 拖拽由平台算位移（`window.moveBy` 那条），不让浏览器抢指针手势 */
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
        touch-action: none;
      }
    </style>
  </head>

  <body>
    <canvas id="pet"></canvas>
    <script type="module" src="/src/petMain.tsx"></script>
  </body>
</html>
