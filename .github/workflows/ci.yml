name: ci

# **跑什么不在这里** —— `verify.yml` 是唯一一份命令清单，`release.yml` 也调它。
# 这一页只回答两件事：什么时候跑，以及同一个 ref 连推两次怎么办。
#
# 2026-10-31 之前这里写着三组 job 的全部命令，而 `release.yml` 只跑 typecheck。
# 抄两份清单的结果是"发得出去"和"测过了"重新变成两件事 —— 同一提交上 release
# 成功、ci 失败真的发生过（40882357297 对 40882358315）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一个 ref 连推两次时，前一次已经没人要了 —— 取消它，别占着 runner 让后一次排队。
# 只写在 ci 里：release 那条**不能**这样，中途取消会留下一个半成品草稿。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 门禁只读仓库；写权限只在 release 那条里给。
permissions:
  contents: read

# 这里刻意**不写** paths-ignore。文档改动看着"只是字"，但 frontend job 里有一条
# `check:docs` 专门盯相对链接和 README 里的数字 —— 那正是文档改错时唯一会红的
# 地方。跳过它等于把这条规矩关掉。真要省时间，省的是别的。
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
