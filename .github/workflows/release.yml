name: release

# 打一个 tag（`v0.2.0`）→ 在 windows-latest 上出 NSIS 安装包 + 更新包 + latest.json，
# 传成一条 **draft** release。确认无误后手动点 Publish，`releases/latest` 才会指向它。
#
# 为什么是 draft：`/releases/latest/download/latest.json` 这个地址只认已发布的
# release。draft 期间更新器查不到任何东西（等于没发），发布那一刻全量生效 ——
# 这比"发出去再后悔"好。
#
# 点 Publish 的时候**别勾 "Set as a pre-release"**：`/releases/latest` 跳过的
# 不只是草稿，还有预发布。勾上之后 release 页面正常、产物都在、按 tag 直链的
# latest.json 也 200，唯独更新器唯一会去敲的那个地址是 404 —— 而插件对任何
# 非 2xx 都抛同一句 `ReleaseNotFound`，跟真断网长得一样。v0.1.0 就这么挂了一版。
#
# 为什么要 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY          更新包的 minisign 私钥（`.keys/updater.key` 的内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 生成时设的密码；没设就留空（但那样建议别用）
# 私钥进仓库 = 任何人都能给你所有用户推假更新。它只在这台机器和这个仓库的 Secrets 里。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 全量编一次要十几分钟，缓存能砍掉大半
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 前端类型检查先过一遍：打包要跑 `npm run build`，类型错了会白等十分钟
      - run: npm run typecheck

      # 把密钥里的换行去掉再交给 tauri。
      #
      # GitHub 的 Secret 文本框会原样保存粘贴进来的内容：`cat .keys/updater.key | clip`
      # 复制过去时末尾那个换行也在，而 tauri 的 base64 解码器不认它 —— 报
      # `failed to decode base64 key: Invalid symbol 10, offset 348`（10 就是 `\n`，
      # 348 正好是这把钥匙的长度）。第一次发版就栽在这里：编译 3 分 54 秒、
      # NSIS 都打出来了，最后签名这一步红掉。
      #
      # 这一步只是清洗，不改密钥本身；顺手把"空密钥"变成一条能看懂的报错。
      - name: Normalize the signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n')
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty — add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "signing key: ${#KEY} characters"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 密钥来自上一步写进 GITHUB_ENV 的那份（已去掉换行）。
          # **不要**在这里再写一次 `secrets.TAURI_SIGNING_PRIVATE_KEY` ——
          # 步骤级 env 会盖掉 GITHUB_ENV，等于把换行又塞回去了
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lattice ${{ github.ref_name }}
          releaseBody: |
            安装包在下面。已经装过旧版本的，可以在设置菜单里点 **Check for updates** 直接升级。

            这个版本包含什么、修了什么，看仓库的提交记录。
          # 先出草稿，人工过一眼再发布
          releaseDraft: true
          prerelease: false

      # ---------------------------------------------------------------------
      # Authenticode 签名（**休眠中**：配齐变量才跑，见 docs/CODE_SIGNING.md 第二节）
      #
      # 为什么是"休眠"而不是"必须先签"：SignPath Foundation 要人工审（1–3 个
      # 工作日），审核期间照常发未签名的包。所以这一组步骤整个挂在
      # `vars.SIGNPATH_ORGANIZATION_ID != ''` 上 —— 没配 = 跳过，配了 = 自动签。
      # 别把它改成"没有签名就失败"：那会让一次审核卡住整个发布。
      #
      # 为什么签完还要做三件事：**Authenticode 签名会改字节**（PE 尾部多一段
      # 证书），而 tauri-action 已经按**未签名**的那份 exe 算过更新器那种
      # minisign（release 上的 `.exe.sig` 与 latest.json 里的 signature）。
      # 不对齐的话，自动更新会在用户那边报签名校验失败，而"检查更新"本身
      # 看起来是成功的 —— 症状和原因离得很远。所以顺序是：
      #   签过的 exe 放回打包目录 → 用同一把更新器私钥重签 → latest.json 里的
      #   signature 换成新的 → 三个资产重传。
      # 顺序不能换：后面的 SHA-256 与 winget 清单都从**那个目录**现算，
      # 必须算在签过的字节上。
      #
      # 要配的四个值（仓库 Settings → Secrets and variables → Actions）：
      #   SIGNPATH_API_TOKEN（secret，submitter 权限）
      #   SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
      #   SIGNPATH_SIGNING_POLICY_SLUG / SIGNPATH_ARTIFACT_CONFIGURATION_SLUG（variables）
      # Artifact configuration 里要指向 zip 里的 `Lattice_<版本>_x64-setup.exe`：
      # GitHub 的 artifact 是打 zip 传的，SignPath 按那层路径取文件。
      # 签名 policy 若要求人工批准，这一步会一直等到批准（`wait-for-completion`），
      # 别把 job 的超时调得比审批习惯还短。
      # ---------------------------------------------------------------------
      - name: Upload the unsigned installer
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: lattice-nsis-unsigned
          path: src-tauri/target/release/bundle/nsis/Lattice_*_x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Put the signed installer back and re-sign the updater artifact
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 重签要用同一把更新器私钥；`TAURI_SIGNING_PRIVATE_KEY` 由上面
          # "Normalize the signing key" 那一步写进 GITHUB_ENV，这里不用再写
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BUNDLE=src-tauri/target/release/bundle/nsis
          EXE="$BUNDLE/Lattice_${VERSION}_x64-setup.exe"

          # SignPath 交回来的可能是一层 zip（GitHub 那边本来就是 zip 传的）
          find signed -name '*.zip' -exec unzip -o -q {} -d signed \;
          SIGNED=$(find signed -name "Lattice_${VERSION}_x64-setup.exe" -print -quit)
          if [ -z "${SIGNED}" ]; then
            echo "::error::SignPath 没交回 Lattice_${VERSION}_x64-setup.exe —— 不发未签名的包，也别手改这一步"
            find signed -maxdepth 3 -type f
            exit 1
          fi
          cp "${SIGNED}" "${EXE}"

          # 更新器签名重算：Authenticode 之后字节变了，原来那份 .sig 作废
          node scripts/tauri.mjs signer sign "${EXE}"
          if [ ! -s "${EXE}.sig" ]; then
            echo "::error::重签没有产出 ${EXE}.sig"
            exit 1
          fi

          # latest.json 里两处 platform 的 signature 一起换（windows-x86_64 与 -nsis）
          mkdir -p dl
          gh release download "${TAG}" --pattern latest.json --dir dl --clobber
          SIGNATURE=$(cat "${EXE}.sig") node - <<'JS'
          const fs = require("node:fs");
          const path = "dl/latest.json";
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
          const platforms = Object.values(manifest.platforms ?? {});
          if (platforms.length === 0) {
            console.error("latest.json 里没有 platforms —— 形状变了，别猜着改");
            process.exit(1);
          }
          for (const platform of platforms) platform.signature = process.env.SIGNATURE;
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          console.log(`latest.json: ${platforms.length} 处 signature 换成新签的`);
          JS

          gh release upload "${TAG}" "${EXE}" "${EXE}.sig" dl/latest.json --clobber
          echo "已替换：签过名的 exe、重签的 .sig、改好的 latest.json"

      # 信任链在这里一次问清楚（CODE_SIGNING 第二节那个"未证实的说法"）。
      # runner 的信任库和用户机器不完全一样，但 `Valid` 至少说明链到公共根；
      # 真要给结论还得在一台干净 Windows 上再跑一遍同样的命令。
      - name: Check the Authenticode chain
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          "status=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode 没链通：status=$($sig.Status)。发布前先看 docs/CODE_SIGNING.md 第三节"
          }
          "chain=ok root=$($sig.SignerCertificate.Issuer)"

      # release 附上安装包的 SHA-256。
      #
      # README 里写着"安装包没签名，SmartScreen 会拦"（见 docs/CODE_SIGNING.md），
      # 那就得给用户一个自己能核对的东西 —— 否则"我下到的到底是不是官方包"没有答案。
      # 签名解决的是"谁做的"，哈希解决的是"有没有被换过"，未签名期间后者是唯一能给的。
      #
      # `continue-on-error` 是故意的，别改成默认：这一步跑在编译完、NSIS 打完、
      # release 草稿已经建好之后，算个哈希失败绝不该把整个 release 判红。
      # 宁可少一行哈希，不能白编十分钟。
      - name: Append SHA-256 to the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          DIR=src-tauri/target/release/bundle/nsis
          if [ ! -d "$DIR" ]; then
            echo "::warning::no NSIS bundle at $DIR — nothing to hash"
            exit 0
          fi
          gh release view "$TAG" --json body -q .body > notes.md
          # 上一次跑留下的那一段先切掉。重跑同一个 tag 是常事（改了代码重打、
          # 或者 action 那步失败重试），而 `gh release edit` 是**整份替换**进来的
          # 这几行：不切的话 notes 里会攒出两段 `### SHA-256`，后一段是新的、
          # 前一段是上一版安装包的哈希 —— 用户照着核对，核对的是旧的。
          awk '/^### SHA-256$/{exit} {print}' notes.md > notes-base.md
          {
            cat notes-base.md
            printf '\n### SHA-256\n\n'
            printf 'Verify the download before running it:\n\n'
            printf '```\n'
            ( cd "$DIR" && sha256sum *.exe )
            printf '```\n'
          } > notes-full.md
          gh release edit "$TAG" --notes-file notes-full.md
          cat notes-full.md

      # winget 的三份清单（version / installer / locale），跟着草稿一起挂在附件里。
      #
      # 为什么在 release 这一侧生成，不在仓库里存一份：清单里有两样只属于"这一次的
      # 那份 exe"的东西 —— 直链和 SHA-256。仓库里存一份的话，下次发版要么忘了改、
      # 要么改了但哈希和真正发出去的包不是一份，而错的清单要到 microsoft/winget-pkgs
      # 的校验器那里才会红。所以从这次真正打出来的 exe 上现算。
      #
      # 和上面那步同一条规矩：`continue-on-error`，算不出来不该把整个 release 判红。
      # 提 PR 的动作是人做的（要审、要等），步骤在 docs/reference/build.md 第五节。
      - name: Attach winget manifests to the release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          node scripts/winget-manifest.mjs
          shopt -s nullglob
          FILES=(dist-winget/manifests/u/unraveltao/Lattice/*/*.yaml)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::warning::no winget manifests under dist-winget/"
            exit 0
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
          printf '%s\n' "${FILES[@]}"
