[package]
name = "lattice"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lattice_lib"
# 只做桌面端，所以不需要 staticlib / cdylib。
# 留着 cdylib 会让 windows-gnu 去导出一个巨大的符号表，
# ld 会报 "export ordinal too large"（见 docs/ROADMAP.md）。
# 将来要做移动端再把 staticlib / cdylib 加回来。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# 平台自身的自动更新（组件更新是另一套：目录 + .lattice 包 + ed25519）。
# 两者别混：组件更新由前端 `runtime/catalogue.ts` 驱动，这个只管"Lattice 本身要不要升级"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
# `.lattice` 包（ZIP）的解压。自己写容器格式（package_policy.rs），
# 但 deflate 不自己写 —— 那是压缩算法，不是布局
flate2 = "1"
# 组件包签名（signature.rs）。ed25519 不自己写 —— 那是密码学，不是布局；
# 而且 Node 内置 `crypto.sign` 就是 ed25519，打包脚本那边不用装任何东西
ed25519-dalek = "2"
sha2 = "0.10"
# agent 端点的令牌。系统随机数不自己写 —— 那是密码学，不是布局。
# 0.2 已经在依赖树里（ed25519-dalek 那条链），加这一行不新增编译单元
getrandom = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
# 出网闸门要用 WebView2 的 FrameNavigationStarting —— 那是 wry 不暴露的 COM 事件，
# 只能自己拿 controller 挂。版本必须和 tauri/wry 依赖的那份一致（Cargo.lock 里
# 是 0.39.1），否则同名类型会变成两个不兼容的 crate。
webview2-com = "0.39"
# PWSTR：读 COM 回填的字符串。windows 0.62 本来就在树里，加它不会多编一份
windows = { version = "0.62", features = [
  # 媒体控制走 WinRT 的 SMTC，只有这一份 API
  "Media_Control",
  # WinRT 激活要求调用线程初始化过 COM
  "Win32_System_Com",
  # 声音高低走 WASAPI 回环采集：IMMDeviceEnumerator / IAudioClient 在这
  "Win32_Media_Audio",
  # 上面那个的 Activate 签名里有 PROPVARIANT（我们传 None，但类型要能解析）
  "Win32_System_Com_StructuredStorage",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  # DwmGetWindowAttribute(DWMWA_CLOAKED)：被系统 cloak 掉的窗口不算看得见
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  # GetModuleHandleW：参考线叠层窗口要注册一个自己的窗口类
  "Win32_System_LibraryLoader",
  # GetSystemPowerStatus：电量、交流电、节电模式（lattice.battery 那条命令）
  "Win32_System_Power",
  # GetPerformanceInfo：提交量、进程/线程/句柄计数
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  # SYSTEM_PROCESSOR_PERFORMANCE_INFORMATION：每个核的累计计数
  "Win32_System_WindowsProgramming",
  # SendInput：键鼠那三只手（input.click / type / key）。
  # 这个 feature 在 windows-sys 里是独立的，不带上它连 INPUT 结构体都没有
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # NtQuerySystemInformation(SystemProcessorPerformanceInformation)：逐核占用
  # 只有 Wdk 命名空间里才有这条绑定，Win32 那边只给了整机的 GetSystemTimes
  "Wdk_System_SystemInformation",
] }
