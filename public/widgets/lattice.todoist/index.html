<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Todoist 待办</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="tz" id="root" data-view="boot">
      <!--
        顶上这条 22px 不是装饰：桌面窗口的窗饰（拖动/层级/别针/重载/收回）浮在
        右上角 6px 处、约 120×28，而且能点。所以它只留左边可用，写的是"现在
        有几项"，不写组件名 —— 名字平台标题条上有。
      -->
      <header class="tz-head">
        <span class="tz-meta" id="meta"></span>
      </header>

      <!-- 连上 Todoist 那一刻说一次就走的提示（本地还有几条没搬过去） -->
      <p class="tz-note" id="note" hidden>
        <span class="tz-note-text" id="noteText"></span>
        <button class="tz-link" type="button" id="noteClose">知道了</button>
      </p>

      <section class="tz-setup" id="setup" hidden>
        <p class="tz-hint" id="setupHint"></p>
        <button class="tz-link" type="button" id="openSettings">打开 Todoist 设置页</button>
        <form class="tz-form" id="tokenForm">
          <input
            class="tz-input"
            id="tokenInput"
            type="password"
            autocomplete="off"
            spellcheck="false"
            maxlength="120"
          />
          <button class="tz-btn" type="submit" id="tokenSave">连接</button>
        </form>
        <p class="tz-error" id="setupError" hidden></p>
        <div class="tz-actions">
          <button class="tz-link" type="button" id="useLocal" hidden></button>
          <button class="tz-link" type="button" id="disconnect" hidden></button>
          <button class="tz-link" type="button" id="cancel" hidden></button>
        </div>
      </section>

      <div class="tz-body" id="body">
        <ul class="tz-list" id="list"></ul>
        <p class="tz-empty" id="empty" hidden></p>
      </div>

      <!-- 本地草稿本的输入框：只在"没有 Todoist"那一档出现 -->
      <form class="tz-form tz-add" id="localForm" hidden>
        <input
          class="tz-input"
          id="localInput"
          type="text"
          autocomplete="off"
          maxlength="160"
        />
      </form>

      <footer class="tz-foot">
        <span class="tz-status" id="status"></span>
        <button class="tz-icon" type="button" id="refresh" aria-label="刷新">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13 8a5 5 0 1 1-1.6-3.7" />
            <path d="M13 2.4V5h-2.6" />
          </svg>
        </button>
        <button class="tz-icon" type="button" id="connect" aria-label="连接 Todoist" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.6 11.4h6.8a2.4 2.4 0 0 0 .3-4.8 3.1 3.1 0 0 0-6-1 2.3 2.3 0 0 0-1.1 5.8z" />
          </svg>
        </button>
        <button class="tz-icon" type="button" id="settings" aria-label="换一个 token">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="8" r="2.2" />
            <path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1" />
          </svg>
        </button>
      </footer>
    </main>
    <script src="todoist-core.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
