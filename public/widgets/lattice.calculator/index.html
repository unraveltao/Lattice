<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>计算器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      三个页签挤在一张 300×260 的卡片里。为什么是页签而不是三个组件：算一下、
      转一下、算个哈希是同一件事的三步，分开放只会让人装三个卡片找哪个是哪个。
    -->
    <main class="calc" id="root">
      <!--
        顶上这条 22px 是标题栏，也是给窗饰让位的那一条。桌面窗口的五个功能
        按钮浮在右上角 6px 处、约 120×28，指针一进窗口就现身 —— 页签原本从
        8px 就开始排，最右边那颗「Hash」正好压在按钮下面，点下去点到的是「收回」。
        和待办 / 系统监视器 / 媒体一样：标题栏留 `padding-right: 120px`。
      -->
      <header class="calc-head">
        <span class="calc-title">计算器</span>
      </header>

      <nav class="calc-tabs" role="tablist">
        <button type="button" class="calc-tab is-active" data-pane="calc" role="tab">计算</button>
        <button type="button" class="calc-tab" data-pane="encode" role="tab">编码</button>
        <button type="button" class="calc-tab" data-pane="hash" role="tab">哈希</button>
      </nav>

      <section class="calc-pane is-active" data-pane="calc">
        <input
          id="expr"
          class="calc-expr"
          type="text"
          inputmode="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="0"
          aria-label="表达式"
        />
        <div class="calc-result" id="result">= 0</div>
        <ul class="calc-history" id="history"></ul>
      </section>

      <section class="calc-pane" data-pane="encode">
        <textarea
          id="encode-in"
          class="calc-text"
          spellcheck="false"
          placeholder="要编码或解码的文字"
          aria-label="编码输入"
        ></textarea>
        <div class="calc-row">
          <button type="button" class="calc-btn" data-encode="b64-enc">Base64 ↑</button>
          <button type="button" class="calc-btn" data-encode="b64-dec">Base64 ↓</button>
          <button type="button" class="calc-btn" data-encode="url-enc">URL ↑</button>
          <button type="button" class="calc-btn" data-encode="url-dec">URL ↓</button>
        </div>
        <div class="calc-out" id="encode-out" data-empty="true">还没有结果</div>
      </section>

      <section class="calc-pane" data-pane="hash">
        <textarea
          id="hash-in"
          class="calc-text"
          spellcheck="false"
          placeholder="要计算哈希的文字"
          aria-label="哈希输入"
        ></textarea>
        <div class="calc-out is-mono" id="hash-out" data-empty="true">MD5 显示在这里</div>
      </section>

      <button type="button" class="calc-copy" id="copy" hidden>复制</button>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
