<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>系统</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="sys">
      <header class="sys-head">
        <h1 class="sys-title" id="title">系统</h1>
        <span class="sys-meta" id="uptime"></span>
      </header>

      <section class="sys-metric">
        <div class="sys-line">
          <span class="sys-label"><i class="sys-dot is-cpu"></i>CPU</span>
          <span class="sys-value" id="cpu">—</span>
        </div>
      </section>

      <!-- 折线：CPU 带填充、内存一条虚线。宽度按像素量，1 用户单位 = 1px -->
      <figure class="sys-trend" id="trend">
        <svg id="trend-svg" viewBox="0 0 200 48" preserveAspectRatio="none" aria-hidden="true">
          <polygon id="trend-area" points="" />
          <polyline id="trend-cpu" points="" />
          <polyline id="trend-mem" points="" />
        </svg>
      </figure>

      <section class="sys-metric">
        <div class="sys-line">
          <span class="sys-label" id="label-mem"><i class="sys-dot is-mem"></i><span id="mem-name">内存</span></span>
          <span class="sys-value" id="mem">—</span>
        </div>
        <div class="sys-sub">
          <span id="mem-sub"></span>
          <span id="mem-commit"></span>
        </div>
      </section>

      <!-- 逐核占用：一根竖条一个逻辑核，横着排一排 -->
      <div class="sys-cores" id="cores" hidden></div>

      <footer class="sys-foot">
        <div class="sys-foot-row">
          <span class="sys-cell" id="disk">—</span>
          <span class="sys-cell" id="procs">—</span>
        </div>
        <div class="sys-foot-row">
          <span class="sys-cell" id="down">—</span>
          <span class="sys-cell" id="up">—</span>
        </div>
      </footer>

      <p class="sys-hint" id="hint"></p>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
