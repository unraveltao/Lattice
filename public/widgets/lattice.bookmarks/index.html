<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>收藏夹</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shelf">
      <header class="shelf-head">
        <h1 class="shelf-title">收藏夹</h1>
        <span class="shelf-count" id="count" aria-live="polite"></span>
      </header>

      <form class="shelf-form" id="form">
        <input
          class="shelf-input"
          id="url"
          type="text"
          placeholder="粘贴链接，回车确认"
          autocomplete="off"
          spellcheck="false"
          maxlength="2048"
          aria-label="链接地址"
        />
      </form>

      <p class="shelf-hint" id="hint" aria-live="polite"></p>

      <div class="shelf-body">
        <ul class="shelf-list" id="list"></ul>
        <p class="shelf-empty" id="empty">还没有链接 —— 在上面粘贴一条</p>
      </div>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
