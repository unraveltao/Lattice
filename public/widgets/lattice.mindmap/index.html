<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>思维导图</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      思维导图。

      顶上 22px 是标题栏，右侧 120px 留给桌面窗口的窗饰（WIDGET_SPEC §5.1）——
      所以状态只占左边那一条，工具全放底下。

      标题栏里写的是**此刻的状态**（几个节点 / 存没存上），不是组件名：名字在
      组件库和窗口标题上已经有了，卡片第一行再写一遍是浪费高度。
    -->
    <main class="mm" id="root">
      <header class="mm-head">
        <span class="mm-state" id="state" role="status"></span>
      </header>

      <div class="mm-stage" id="stage">
        <svg class="mm-svg" id="svg" xmlns="http://www.w3.org/2000/svg">
          <g id="viewport">
            <g id="links" class="mm-links"></g>
            <g id="nodes" class="mm-nodes"></g>
          </g>
        </svg>

        <div class="mm-empty" id="empty">
          <p class="mm-empty-text" id="empty-text">An empty map — one line is enough.</p>
          <button type="button" class="mm-start" id="start">Start a map</button>
        </div>

        <textarea
          class="mm-edit"
          id="editor"
          rows="1"
          maxlength="80"
          spellcheck="false"
          hidden
        ></textarea>
      </div>

      <footer class="mm-bar" id="bar">
        <button type="button" class="mm-tool" id="undo" title="撤销">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 9h8a4 4 0 1 1 0 8H9M4.5 9l3.5-3.5M4.5 9 8 12.5" /></svg>
        </button>
        <button type="button" class="mm-tool" id="redo" title="重做">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 9h-8a4 4 0 1 0 0 8H11M15.5 9 12 5.5M15.5 9 12 12.5" /></svg>
        </button>
        <button type="button" class="mm-tool" id="fit" title="适应窗口">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5V3h4.5M17 7.5V3h-4.5M17 12.5V17h-4.5M3 12.5V17h4.5" /></svg>
        </button>

        <span class="mm-sep" aria-hidden="true"></span>

        <button type="button" class="mm-copy" id="copy-markdown" title="复制成 Markdown 大纲">MD</button>
        <button type="button" class="mm-copy" id="copy-mermaid" title="复制成 Mermaid">Mermaid</button>
        <button type="button" class="mm-copy" id="copy-opml" title="复制成 OPML">OPML</button>

        <span class="mm-zoom" id="zoom">100%</span>
      </footer>
    </main>
    <script src="mindmap-core.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
