<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>架构图</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      架构图 / 流程图。

      顶上 22px 是标题栏，右侧 120px 留给桌面窗口的窗饰（WIDGET_SPEC §5.1）——
      所以工具条放在**底下**，不放右上角：那里是五颗窗饰按钮的地盘。
    -->
    <main class="dg" id="root">
      <header class="dg-head">
        <h1 class="dg-title" id="title">架构图</h1>
        <span class="dg-status" id="status" role="status"></span>
      </header>

      <div class="dg-stage" id="stage">
        <svg class="dg-svg" id="svg" xmlns="http://www.w3.org/2000/svg">
          <g id="viewport">
            <g id="edges" class="dg-edges"></g>
            <g id="nodes" class="dg-nodes"></g>
            <g id="handles" class="dg-handles"></g>
          </g>
        </svg>
        <p class="dg-empty" id="empty">双击空白处加一个框</p>
        <textarea
          class="dg-text"
          id="editor"
          rows="1"
          maxlength="40"
          spellcheck="false"
          hidden
        ></textarea>
      </div>

      <footer class="dg-bar" id="bar">
        <button type="button" class="dg-tool" data-add="box" id="add-box" title="矩形">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="5" width="14" height="10" rx="2" /></svg>
        </button>
        <button type="button" class="dg-tool" data-add="diamond" id="add-diamond" title="菱形">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 17.5 10 10 17.5 2.5 10Z" /></svg>
        </button>
        <button type="button" class="dg-tool" data-add="circle" id="add-circle" title="圆">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" /></svg>
        </button>
        <button type="button" class="dg-tool" data-add="text" id="add-text" title="文本">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h12M10 4.5v11" /></svg>
        </button>

        <span class="dg-sep" aria-hidden="true"></span>

        <button type="button" class="dg-tool" id="connect" title="连线（点两个框）">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h9M9 6.5l4 3.5-4 3.5" /></svg>
        </button>
        <button type="button" class="dg-tool" id="tone" title="换色调">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" /><path d="M10 3a7 7 0 0 1 0 14Z" class="is-filled" /></svg>
        </button>

        <span class="dg-sep" aria-hidden="true"></span>

        <button type="button" class="dg-tool" id="undo" title="撤销">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 9h8a4 4 0 1 1 0 8H9M4.5 9l3.5-3.5M4.5 9 8 12.5" /></svg>
        </button>
        <button type="button" class="dg-tool" id="redo" title="重做">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 9h-8a4 4 0 1 0 0 8H11M15.5 9 12 5.5M15.5 9 12 12.5" /></svg>
        </button>
        <button type="button" class="dg-tool" id="fit" title="适应窗口">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5V3h4.5M17 7.5V3h-4.5M17 12.5V17h-4.5M3 12.5V17h4.5" /></svg>
        </button>

        <span class="dg-zoom" id="zoom">100%</span>
      </footer>
    </main>
    <script src="diagram-core.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
