<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>专注</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="focus" id="root" data-phase="work" data-running="false">
      <header class="focus-head">
        <h1 class="focus-phase" id="phase">专注</h1>
        <span class="focus-rounds" id="rounds"></span>
      </header>

      <p class="focus-time" id="time">25:00</p>

      <div class="focus-actions">
        <button type="button" class="focus-btn is-primary" id="toggle">开始</button>
        <button type="button" class="focus-btn" id="reset">重置</button>
      </div>

      <p class="focus-hint" id="hint"></p>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
